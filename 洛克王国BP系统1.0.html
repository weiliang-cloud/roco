<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国征召</title>
    <style>
        /* ===== 全局重置 & 基础样式（浅色主题） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: #e8edf5;
            background-image: radial-gradient(ellipse at 20% 50%, #d6e0f0 0%, #e8edf5 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .bp-container {
            width: 1300px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 28px;
            padding: 24px 28px 28px;
            border: 2px solid rgba(200, 180, 140, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
        }

        .bp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(180, 160, 130, 0.2);
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bp-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bp-title h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #d4a030, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(184, 134, 11, 0.1);
            letter-spacing: 2px;
        }

        .bp-title .subtitle {
            color: rgba(80, 70, 50, 0.5);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .bp-header > div:last-child {
            color: rgba(80, 70, 50, 0.4);
            font-size: 12px;
        }

        /* ===== Ban位行：三列 ===== */
        .ban-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .ban-group {
            background: rgba(245, 240, 235, 0.7);
            border-radius: 16px;
            padding: 10px 12px 12px;
            border: 1px solid rgba(180, 160, 140, 0.15);
            min-height: 72px;
            transition: background 0.2s;
        }

        .ban-group.drag-over {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .ban-group .ban-label {
            font-size: 11px;
            color: rgba(80, 70, 50, 0.5);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ban-group .ban-label .count {
            color: rgba(180, 150, 80, 0.6);
            font-size: 10px;
        }

        .ban-slots {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            min-height: 44px;
        }

        .ban-slot {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: rgba(200, 190, 180, 0.2);
            border: 1.5px dashed rgba(160, 150, 140, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        .ban-slot.filled {
            border-style: solid;
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(212, 175, 55, 0.08);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.06);
        }

        .ban-slot img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 4px;
        }

        .ban-slot .pet-name-tiny {
            font-size: 7px;
            color: rgba(80, 70, 50, 0.6);
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            letter-spacing: 0.3px;
            background: rgba(255,255,255,0.6);
            padding: 0 4px;
            border-radius: 4px;
        }

        .ban-slot .ban-mark {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 14px;
            color: #d9534f;
            filter: drop-shadow(0 0 6px rgba(217, 83, 79, 0.2));
        }

        .ban-group.public {
            border-color: rgba(212, 175, 55, 0.2);
            background: rgba(212, 175, 55, 0.04);
        }
        .ban-group.public .ban-label {
            color: rgba(180, 150, 80, 0.7);
        }
        .ban-group.public .ban-slots {
            justify-content: center;
        }

        .ban-slot .from-player {
            font-size: 7px;
            position: absolute;
            bottom: 1px;
            right: 3px;
            color: rgba(80, 70, 50, 0.3);
            background: rgba(255,255,255,0.5);
            padding: 0 4px;
            border-radius: 4px;
        }

        /* ===== 主区域：三栏 ===== */
        .main-area {
            display: grid;
            grid-template-columns: 180px 1fr 180px;
            gap: 14px;
            margin-bottom: 14px;
        }

        /* ===== 左右两侧：选择区 ===== */
        .pick-group {
            background: rgba(245, 240, 235, 0.6);
            border-radius: 16px;
            padding: 12px 12px 14px;
            border: 1px solid rgba(180, 160, 140, 0.12);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        .pick-group.drag-over {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .pick-group .pick-label {
            font-size: 11px;
            color: rgba(80, 70, 50, 0.5);
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pick-group .pick-label .badge {
            font-size: 9px;
            background: rgba(212, 175, 55, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
            color: rgba(180, 150, 80, 0.6);
        }

        .pick-group.player1 .pick-label {
            color: rgba(50, 130, 200, 0.7);
        }
        .pick-group.player2 .pick-label {
            color: rgba(200, 80, 80, 0.7);
        }

        .pick-slots {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-height: 300px;
        }

        .pick-slot {
            width: 100%;
            min-height: 52px;
            border-radius: 12px;
            background: rgba(200, 190, 180, 0.15);
            border: 1.5px dashed rgba(160, 150, 140, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            position: relative;
            padding: 4px 8px;
            flex-shrink: 0;
        }

        .pick-slot.filled {
            border-style: solid;
            border-color: rgba(212, 175, 55, 0.3);
            background: rgba(212, 175, 55, 0.06);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.04);
            justify-content: flex-start;
            gap: 12px;
        }

        .pick-slot img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 4px;
        }

        .pick-slot .pick-name {
            font-size: 12px;
            color: rgba(50, 45, 40, 0.8);
            font-weight: 400;
        }

        .pick-slot .pick-value {
            position: absolute;
            right: 8px;
            font-size: 10px;
            color: rgba(180, 150, 80, 0.3);
            font-weight: 700;
        }

        .pick-slot .empty-hint {
            font-size: 14px;
            color: rgba(160, 150, 140, 0.3);
        }

        /* ===== 宠物池 ===== */
        .pet-pool {
            background: rgba(245, 240, 235, 0.5);
            border-radius: 16px;
            padding: 12px 14px 14px;
            border: 1px solid rgba(180, 160, 140, 0.1);
            max-height: 480px;
            overflow-y: auto;
        }

        .pet-pool::-webkit-scrollbar {
            width: 4px;
        }
        .pet-pool::-webkit-scrollbar-track {
            background: transparent;
        }
        .pet-pool::-webkit-scrollbar-thumb {
            background: rgba(180, 150, 80, 0.2);
            border-radius: 10px;
        }

        .pool-title {
            font-size: 11px;
            color: rgba(80, 70, 50, 0.4);
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pool-title .remain {
            color: rgba(180, 150, 80, 0.4);
            font-size: 10px;
        }

        .pool-group {
            margin-bottom: 8px;
        }

        .pool-group .group-label {
            font-size: 12px;
            font-weight: 700;
            color: rgba(180, 150, 80, 0.6);
            margin-bottom: 4px;
            padding-left: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pool-group .group-label .line {
            flex: 1;
            height: 1px;
            background: rgba(180, 160, 140, 0.1);
        }

        .pool-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pool-pet {
            width: 72px;
            height: 85px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px solid rgba(180, 160, 140, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.2s;
            position: relative;
            flex-shrink: 0;
            padding: 4px 2px;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            gap: 2px;
        }

        .pool-pet:hover:not(.used) {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .pool-pet img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            border-radius: 8px;
            pointer-events: none;
        }

        .pool-pet .pet-name {
            font-size: 10px;
            color: rgba(50, 45, 40, 0.7);
            margin-top: 2px;
            white-space: nowrap;
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            pointer-events: none;
        }

        .pool-pet.used {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(0.8);
            transform: scale(0.92);
            border-color: rgba(200, 80, 80, 0.15);
        }

        .pool-pet.used::after {
            content: '✕';
            position: absolute;
            font-size: 20px;
            color: rgba(200, 80, 80, 0.3);
        }

        .pool-pet.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        /* 拖拽时的克隆体样式 */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 72px;
            height: 85px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            transform: translate(-50%, -50%);
            transition: none;
            gap: 2px;
            padding: 4px;
        }

        .drag-ghost img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            border-radius: 8px;
        }
        .drag-ghost .pet-name {
            font-size: 10px;
            color: rgba(50, 45, 40, 0.8);
            margin-top: 2px;
            white-space: nowrap;
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .player-name-input {
            background: transparent;
            border: none;
            border-bottom: 1.5px solid rgba(160, 150, 140, 0.25);
            color: inherit;
            font-size: inherit;
            font-weight: 600;
            font-family: inherit;
            padding: 0 2px;
            width: 80px;
            outline: none;
            transition: border-color 0.2s;
        }
        .player-name-input:focus {
            border-bottom-color: rgba(212, 175, 55, 0.5);
        }
        .pick-group.player1 .player-name-input {
            color: rgba(50, 130, 200, 0.9);
        }
        .pick-group.player2 .player-name-input {
            color: rgba(200, 80, 80, 0.9);
        }

        /* ===== 底部控制栏 ===== */
        .bp-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(180, 160, 140, 0.12);
            flex-wrap: wrap;
        }

        .bp-controls button {
            padding: 8px 28px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            background: rgba(200, 190, 180, 0.2);
            color: rgba(80, 70, 50, 0.6);
            border: 1px solid rgba(180, 160, 140, 0.1);
        }

        .bp-controls button:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.1);
            color: #b8860b;
            border-color: rgba(212, 175, 55, 0.2);
        }

        .bp-controls button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .bp-controls button.danger {
            color: #d9534f;
            border-color: rgba(217, 83, 79, 0.15);
        }
        .bp-controls button.danger:hover:not(:disabled) {
            background: rgba(217, 83, 79, 0.08);
            border-color: rgba(217, 83, 79, 0.2);
        }

        .bp-controls .status-msg {
            color: rgba(80, 70, 50, 0.4);
            font-size: 12px;
            padding: 0 8px;
            min-width: 120px;
            text-align: center;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 960px) {
            .main-area {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .pick-group {
                min-height: auto;
            }
            .pick-slots {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .pick-slot {
                width: calc(33.33% - 4px);
                min-height: 60px;
            }
            .ban-row {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .bp-container {
                padding: 16px;
            }
            .bp-title h1 {
                font-size: 20px;
            }
        }

        @media (max-width: 600px) {
            .ban-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .pick-slot {
                width: calc(50% - 4px);
            }
            .bp-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .pool-pet {
                width: 60px;
                height: 72px;
            }
            .pool-pet img {
                width: 40px;
                height: 40px;
            }
            .ban-slot {
                width: 40px;
                height: 40px;
            }
            .ban-slot img {
                width: 28px;
                height: 28px;
            }
            .bp-controls {
                gap: 10px;
            }
            .bp-controls button {
                padding: 6px 16px;
                font-size: 12px;
            }
        }

        .pick-group.player2 .pick-slot.filled {
            border-color: rgba(200, 80, 80, 0.2);
            background: rgba(200, 80, 80, 0.04);
        }
        .pick-group.player2 .pick-label .badge {
            background: rgba(200, 80, 80, 0.08);
            color: rgba(200, 80, 80, 0.5);
        }

        .pick-group.player1 .pick-slot.filled {
            border-color: rgba(50, 130, 200, 0.2);
            background: rgba(50, 130, 200, 0.04);
        }
        .pick-group.player1 .pick-label .badge {
            background: rgba(50, 130, 200, 0.08);
            color: rgba(50, 130, 200, 0.5);
        }

        /* 拖拽目标高亮 */
        .drop-target {
            border-color: #d4af37 !important;
            background: rgba(212, 175, 55, 0.12) !important;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body>
    <div class="bp-container" id="app">
        <!-- ===== 顶部标题 ===== -->
        <div class="bp-header">
            <div class="bp-title">
                <h1>⚔️ 洛克BP</h1>
                <span class="subtitle">│  6v6 + 公ban</span>
            </div>
            <div style="color: rgba(80,70,50,0.35); font-size:12px;">拖拽宠物到任意槽位</div>
        </div>

        <!-- ===== Ban位行：三列 ===== -->
        <div class="ban-row">
            <div class="ban-group" data-group="p1-ban">
                <div class="ban-label">
                    <span id="banLabel1">🔵 玩家1 Ban位</span>
                    <span class="count" id="banCount1">0 / 4</span>
                </div>
                <div class="ban-slots" id="banSlots1">
                    <div class="ban-slot" data-index="0"></div>
                    <div class="ban-slot" data-index="1"></div>
                    <div class="ban-slot" data-index="2"></div>
                    <div class="ban-slot" data-index="3"></div>
                </div>
            </div>

            <div class="ban-group public" data-group="pub-ban">
                <div class="ban-label">
                    <span>⭐ 公ban</span>
                    <span class="count" id="banCountPub">0 / 2</span>
                </div>
                <div class="ban-slots" id="banSlotsPub">
                    <div class="ban-slot" data-index="0"></div>
                    <div class="ban-slot" data-index="1"></div>
                </div>
            </div>

            <div class="ban-group" data-group="p2-ban">
                <div class="ban-label">
                    <span id="banLabel2">🔴 玩家2 Ban位</span>
                    <span class="count" id="banCount2">0 / 4</span>
                </div>
                <div class="ban-slots" id="banSlots2">
                    <div class="ban-slot" data-index="0"></div>
                    <div class="ban-slot" data-index="1"></div>
                    <div class="ban-slot" data-index="2"></div>
                    <div class="ban-slot" data-index="3"></div>
                </div>
            </div>
        </div>

        <!-- ===== 主区域 ===== -->
        <div class="main-area">
            <div class="pick-group player1" data-group="p1-pick">
                <div class="pick-label">
                    <span>
                        <input type="text" class="player-name-input" id="p1NameInput" value="玩家1" maxlength="10">
                    </span>
                    <span class="badge" id="pickCount1">0 / 6</span>
                </div>
                <div class="pick-slots" id="pickSlots1">
                    <div class="pick-slot" data-index="0"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="1"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="2"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="3"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="4"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="5"><span class="empty-hint">—</span></div>
                </div>
            </div>

            <div class="pet-pool" id="petPool">
                <div class="pool-title">
                    <span>🐾 宠物池</span>
                    <span class="remain" id="remainCount">剩余: 0</span>
                </div>
                <div id="poolGroups"></div>
            </div>

            <div class="pick-group player2" data-group="p2-pick">
                <div class="pick-label">
                    <span>
                        <input type="text" class="player-name-input" id="p2NameInput" value="玩家2" maxlength="10">
                    </span>
                    <span class="badge" id="pickCount2">0 / 6</span>
                </div>
                <div class="pick-slots" id="pickSlots2">
                    <div class="pick-slot" data-index="0"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="1"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="2"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="3"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="4"><span class="empty-hint">—</span></div>
                    <div class="pick-slot" data-index="5"><span class="empty-hint">—</span></div>
                </div>
            </div>
        </div>

        <!-- ===== 底部控制 ===== -->
        <div class="bp-controls">
            <button class="danger" id="btnReset">⟳ 重置</button>
            <button id="btnUndo" disabled>↩ 撤回</button>
            <span class="status-msg" id="statusMsg">拖拽宠物到目标槽位</span>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 宠物数据（已替换为最新数据）
        // ============================================================
        const PETS = [
  {

        // ============================================================
        //  2. 状态管理（无步骤，纯拖拽）
        // ============================================================
        const state = {
            allPets: PETS.map(p => ({ ...p })),
            location: {},
            p1: { bans: [], picks: [] },
            p2: { bans: [], picks: [] },
            pubBans: [],
            history: [],
        };

        function initLocations() {
            state.location = {};
            state.allPets.forEach(p => {
                state.location[p.id] = { type: 'pool' };
            });
            state.p1.bans = [];
            state.p1.picks = [];
            state.p2.bans = [];
            state.p2.picks = [];
            state.pubBans = [];
            state.history = [];
        }
        initLocations();

        // ============================================================
        //  3. DOM 引用
        // ============================================================
        const $ = id => document.getElementById(id);
        const elBanSlots1 = $('banSlots1');
        const elBanSlots2 = $('banSlots2');
        const elBanSlotsPub = $('banSlotsPub');
        const elPickSlots1 = $('pickSlots1');
        const elPickSlots2 = $('pickSlots2');
        const elPoolGroups = $('poolGroups');
        const elRemainCount = $('remainCount');
        const elBanCount1 = $('banCount1');
        const elBanCount2 = $('banCount2');
        const elBanCountPub = $('banCountPub');
        const elPickCount1 = $('pickCount1');
        const elPickCount2 = $('pickCount2');
        const elStatusMsg = $('statusMsg');
        const elBtnUndo = $('btnUndo');
        const elBtnReset = $('btnReset');
        const elP1NameInput = $('p1NameInput');
        const elP2NameInput = $('p2NameInput');
        const elBanLabel1 = $('banLabel1');
        const elBanLabel2 = $('banLabel2');

        // ============================================================
        //  4. 辅助函数
        // ============================================================
        function getPet(id) {
            return state.allPets.find(p => p.id === id);
        }

        function isPetInPool(petId) {
            return state.location[petId] && state.location[petId].type === 'pool';
        }

        function getPetLocation(petId) {
            return state.location[petId] || null;
        }

        function getSlotLimit(type) {
            if (type === 'p1-ban' || type === 'p2-ban') return 4;
            if (type === 'pub-ban') return 2;
            if (type === 'p1-pick' || type === 'p2-pick') return 6;
            return 0;
        }

        function getSlotCount(type) {
            if (type === 'p1-ban') return state.p1.bans.length;
            if (type === 'p2-ban') return state.p2.bans.length;
            if (type === 'pub-ban') return state.pubBans.length;
            if (type === 'p1-pick') return state.p1.picks.length;
            if (type === 'p2-pick') return state.p2.picks.length;
            return 0;
        }

        function getSlotArray(type) {
            if (type === 'p1-ban') return state.p1.bans;
            if (type === 'p2-ban') return state.p2.bans;
            if (type === 'pub-ban') return state.pubBans;
            if (type === 'p1-pick') return state.p1.picks;
            if (type === 'p2-pick') return state.p2.picks;
            return null;
        }

        function canPlace(petId, targetType) {
            if (!petId) return false;
            if (isPetInPool(petId) === false && getPetLocation(petId)?.type === targetType) {
                return false;
            }
            const limit = getSlotLimit(targetType);
            const count = getSlotCount(targetType);
            if (count >= limit) return false;
            if (!isPetInPool(petId) && getPetLocation(petId)?.type !== targetType) {
                return false;
            }
            return true;
        }

        function placePet(petId, targetType, index) {
            const oldLoc = getPetLocation(petId);
            if (oldLoc && oldLoc.type !== 'pool') {
                const arr = getSlotArray(oldLoc.type);
                if (arr) {
                    const idx = arr.indexOf(petId);
                    if (idx > -1) arr.splice(idx, 1);
                }
            }
            const arr = getSlotArray(targetType);
            if (!arr) return false;
            if (index === undefined || index >= arr.length) {
                arr.push(petId);
            } else {
                arr.splice(index, 0, petId);
            }
            state.location[petId] = { type: targetType, index: arr.indexOf(petId) };
            return true;
        }

        // ============================================================
        //  5. 拖拽逻辑
        // ============================================================

        let dragData = null;

        function initDragDrop() {
            document.addEventListener('dragstart', (e) => {
                const petEl = e.target.closest('.pool-pet');
                if (!petEl || petEl.classList.contains('used')) {
                    e.preventDefault();
                    return;
                }
                const petId = parseInt(petEl.dataset.petId);
                // 修正：petId 可能是字符串，但 dataset 返回字符串，PETS 中 id 是字符串
                // 为了兼容，我们直接使用 dataset.petId 作为字符串
                const petIdStr = petEl.dataset.petId;
                if (!isPetInPool(petIdStr)) {
                    e.preventDefault();
                    return;
                }
                dragData = { petId: petIdStr };
                e.dataTransfer.setData('text/plain', petIdStr);
                e.dataTransfer.effectAllowed = 'move';
                const ghost = petEl.cloneNode(true);
                ghost.classList.add('drag-ghost');
                ghost.style.position = 'fixed';
                ghost.style.pointerEvents = 'none';
                ghost.style.top = '-1000px';
                document.body.appendChild(ghost);
                e.dataTransfer.setDragImage(ghost, 36, 42);
                setTimeout(() => document.body.removeChild(ghost), 0);
                petEl.classList.add('dragging');
            });

            document.addEventListener('dragend', (e) => {
                document.querySelectorAll('.pool-pet.dragging').forEach(el => el.classList.remove('dragging'));
                document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                dragData = null;
            });

            const dropTargets = document.querySelectorAll('.ban-slot, .pick-slot, .ban-group, .pick-group');
            dropTargets.forEach(target => {
                target.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    if (target.classList.contains('ban-slot') || target.classList.contains('pick-slot')) {
                        target.classList.add('drop-target');
                    } else {
                        target.classList.add('drag-over');
                    }
                });
                target.addEventListener('dragleave', (e) => {
                    target.classList.remove('drop-target');
                    target.classList.remove('drag-over');
                });
                target.addEventListener('drop', (e) => {
                    e.preventDefault();
                    target.classList.remove('drop-target');
                    target.classList.remove('drag-over');
                    const petId = e.dataTransfer.getData('text/plain');
                    if (!petId || !dragData) return;
                    let targetType = null;
                    let index = -1;
                    if (target.classList.contains('ban-slot') || target.classList.contains('pick-slot')) {
                        const parentSlots = target.parentElement;
                        const slots = parentSlots.querySelectorAll('.ban-slot, .pick-slot');
                        const idx = Array.from(slots).indexOf(target);
                        if (idx === -1) return;
                        const group = target.closest('.ban-group') || target.closest('.pick-group');
                        if (!group) return;
                        const groupType = group.dataset.group;
                        if (groupType === 'p1-ban') targetType = 'p1-ban';
                        else if (groupType === 'p2-ban') targetType = 'p2-ban';
                        else if (groupType === 'pub-ban') targetType = 'pub-ban';
                        else if (groupType === 'p1-pick') targetType = 'p1-pick';
                        else if (groupType === 'p2-pick') targetType = 'p2-pick';
                        else return;
                        const arr = getSlotArray(targetType);
                        if (arr && idx < arr.length && arr[idx] !== undefined) {
                            elStatusMsg.textContent = '⚠️ 该槽位已被占用';
                            return;
                        }
                        index = idx;
                    } else {
                        const group = target.closest('.ban-group') || target.closest('.pick-group');
                        if (!group) return;
                        const groupType = group.dataset.group;
                        if (groupType === 'p1-ban') targetType = 'p1-ban';
                        else if (groupType === 'p2-ban') targetType = 'p2-ban';
                        else if (groupType === 'pub-ban') targetType = 'pub-ban';
                        else if (groupType === 'p1-pick') targetType = 'p1-pick';
                        else if (groupType === 'p2-pick') targetType = 'p2-pick';
                        else return;
                        const arr = getSlotArray(targetType);
                        if (!arr) return;
                        const limit = getSlotLimit(targetType);
                        for (let i = 0; i < limit; i++) {
                            if (i >= arr.length || arr[i] === undefined) {
                                index = i;
                                break;
                            }
                        }
                        if (index === -1) {
                            elStatusMsg.textContent = '⚠️ 该组已满';
                            return;
                        }
                    }

                    if (!canPlace(petId, targetType)) {
                        elStatusMsg.textContent = '⚠️ 无法放置，请检查容量或宠物是否已被使用';
                        return;
                    }

                    const oldLoc = getPetLocation(petId);
                    state.history.push({
                        petId: petId,
                        from: oldLoc ? { ...oldLoc } : null,
                        to: { type: targetType, index: index },
                    });

                    const success = placePet(petId, targetType, index);
                    if (success) {
                        elStatusMsg.textContent = `✅ 放置 ${getPet(petId).name} 到 ${targetType}`;
                        elBtnUndo.disabled = false;
                        renderAll();
                    } else {
                        elStatusMsg.textContent = '❌ 放置失败';
                    }
                });
            });
        }

        // ============================================================
        //  6. 撤回 & 重置
        // ============================================================

        function undo() {
            if (state.history.length === 0) {
                elStatusMsg.textContent = '⚠️ 没有可撤回的操作';
                return;
            }
            const last = state.history.pop();
            const petId = last.petId;
            const currentLoc = getPetLocation(petId);
            if (currentLoc && currentLoc.type !== 'pool') {
                const arr = getSlotArray(currentLoc.type);
                if (arr) {
                    const idx = arr.indexOf(petId);
                    if (idx > -1) arr.splice(idx, 1);
                }
            }
            if (last.from) {
                const from = last.from;
                if (from.type === 'pool') {
                    state.location[petId] = { type: 'pool' };
                } else {
                    const arr = getSlotArray(from.type);
                    if (arr) {
                        if (from.index !== undefined && from.index <= arr.length) {
                            arr.splice(from.index, 0, petId);
                        } else {
                            arr.push(petId);
                        }
                        state.location[petId] = { type: from.type, index: arr.indexOf(petId) };
                    } else {
                        state.location[petId] = null;
                    }
                }
            } else {
                state.location[petId] = null;
            }
            elStatusMsg.textContent = `↩ 撤回 ${getPet(petId).name}`;
            if (state.history.length === 0) elBtnUndo.disabled = true;
            renderAll();
        }

        function resetAll() {
            initLocations();
            state.history = [];
            elBtnUndo.disabled = true;
            elStatusMsg.textContent = '🔄 已重置';
            renderAll();
        }

        // ============================================================
        //  7. 渲染
        // ============================================================

        function renderAll() {
            renderBanSlots();
            renderPickSlots();
            renderPool();
            renderCounts();
            updatePlayerNameLabels();
        }

        function renderBanSlots() {
            renderBanGroup(elBanSlots1, state.p1.bans, false);
            renderBanGroup(elBanSlots2, state.p2.bans, false);
            renderBanGroup(elBanSlotsPub, state.pubBans, true);
        }

        function renderBanGroup(container, banIds, isPublic) {
            const slots = container.querySelectorAll('.ban-slot');
            slots.forEach((slot, idx) => {
                const petId = banIds[idx] || null;
                if (petId) {
                    const pet = getPet(petId);
                    if (pet) {
                        slot.className = 'ban-slot filled';
                        let html = `
                            <img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">
                            <span class="pet-name-tiny">${pet.name}</span>
                        `;
                        if (!isPublic) {
                            html += `<span class="ban-mark">✕</span>`;
                        } else {
                            const fromP1 = state.p1.bans.includes(petId);
                            const fromP2 = state.p2.bans.includes(petId);
                            if (fromP1 || fromP2) {
                                const label = fromP1 ? 'P1' : 'P2';
                                html += `<span class="from-player">${label}</span>`;
                            }
                        }
                        slot.innerHTML = html;
                    }
                } else {
                    slot.className = 'ban-slot';
                    slot.innerHTML = '';
                }
            });
        }

        function renderPickSlots() {
            renderPickGroup(elPickSlots1, state.p1.picks);
            renderPickGroup(elPickSlots2, state.p2.picks);
        }

        function renderPickGroup(container, pickIds) {
            const slots = container.querySelectorAll('.pick-slot');
            slots.forEach((slot, idx) => {
                const petId = pickIds[idx] || null;
                if (petId) {
                    const pet = getPet(petId);
                    if (pet) {
                        slot.className = 'pick-slot filled';
                        slot.innerHTML = `
                            <img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">
                            <span class="pick-name">${pet.name}</span>
                            <span class="pick-value">${pet.magic}</span>
                        `;
                    }
                } else {
                    slot.className = 'pick-slot';
                    slot.innerHTML = `<span class="empty-hint">—</span>`;
                }
            });
        }

        function renderPool() {
            const groups = {};
            state.allPets.forEach(pet => {
                if (!groups[pet.magic]) groups[pet.magic] = [];
                groups[pet.magic].push(pet);
            });
            const sortedValues = Object.keys(groups).sort((a, b) => b - a);

            let html = '';
            sortedValues.forEach(val => {
                const pets = groups[val];
                html += `<div class="pool-group">`;
                html += `<div class="group-label"><span>${val}★</span><span class="line"></span></div>`;
                html += `<div class="pool-items">`;
                pets.forEach(pet => {
                    const inPool = isPetInPool(pet.id);
                    const classes = `pool-pet ${inPool ? '' : 'used'}`;
                    html += `
                        <div class="${classes}"
                             data-pet-id="${pet.id}"
                             title="${pet.name} (${pet.magic}★)"
                             draggable="${inPool ? 'true' : 'false'}">
                            <img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">
                            <span class="pet-name">${pet.name}</span>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });
            elPoolGroups.innerHTML = html;

            const total = state.allPets.length;
            const used = state.allPets.filter(p => !isPetInPool(p.id)).length;
            elRemainCount.textContent = `剩余: ${total - used}`;
        }

        function renderCounts() {
            elBanCount1.textContent = `${state.p1.bans.length} / 4`;
            elBanCount2.textContent = `${state.p2.bans.length} / 4`;
            elBanCountPub.textContent = `${state.pubBans.length} / 2`;
            elPickCount1.textContent = `${state.p1.picks.length} / 6`;
            elPickCount2.textContent = `${state.p2.picks.length} / 6`;
        }

        function updatePlayerNameLabels() {
            const name1 = elP1NameInput.value || '玩家1';
            const name2 = elP2NameInput.value || '玩家2';
            elBanLabel1.textContent = `🔵 ${name1} Ban位`;
            elBanLabel2.textContent = `🔴 ${name2} Ban位`;
        }

        // ============================================================
        //  8. 初始化
        // ============================================================

        function init() {
            renderAll();
            initDragDrop();

            elBtnUndo.addEventListener('click', undo);
            elBtnReset.addEventListener('click', resetAll);

            elP1NameInput.addEventListener('input', updatePlayerNameLabels);
            elP2NameInput.addEventListener('input', updatePlayerNameLabels);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
