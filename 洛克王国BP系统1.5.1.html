    }
    syncNames();
    renderAll();
    elStatusMsg.textContent = `模式: ${mode==='magic'?'魔力赛': mode==='ladder'?'天梯赛':'常规'} BP`;
}

function updateLadderMagic() {
    if (state.bpMode !== 'ladder') return;
    const sum = calcMagicSum(state.p1.picks);
    const maxMagic = 16;
    const over = sum > maxMagic;
    const display = `${sum}/${maxMagic}`;
    const color = over ? '#d9534f' : 'inherit';
    const displayEl = document.getElementById('ladderMagicDisplay');
    if (displayEl) {
        displayEl.textContent = display;
        displayEl.style.color = color;
    }
}

function renderPool() {
    let displayPets = state.allPets.filter(p => true);

    const query = POOL_STATE.searchQuery.trim().toLowerCase();
    if (query) {
        displayPets = displayPets.filter(p =>
            p.name.toLowerCase().includes(query) ||
            String(p.number).includes(query) ||
            p.id.toLowerCase().includes(query)
        );
    }

    if (POOL_STATE.filterMagic > 0) {
        displayPets = displayPets.filter(p => p.magic === POOL_STATE.filterMagic);
    }

    displayPets.sort((a, b) => b.number - a.number);

    const groups = {};
    displayPets.forEach(pet => {
        if (!groups[pet.magic]) groups[pet.magic] = [];
        groups[pet.magic].push(pet);
    });
    const sortedMagic = Object.keys(groups).sort((a, b) => b - a);

    let html = '';
    if (sortedMagic.length === 0) {
        html = `<div style="text-align:center;color:var(--text-muted);font-size:11px;padding:16px 0;">🐾 没有找到匹配的宠物</div>`;
    } else {
        sortedMagic.forEach(val => {
            const pets = groups[val];
            html += `<div class="pool-group"><div class="group-label"><span>${val}★</span><span class="line"></span></div><div class="pool-items">`;
            pets.forEach(pet => {
                const isPicked = state.p1.picks.includes(pet.id) || state.p2.picks.includes(pet.id);
                const isBanned = state.p1.bans.includes(pet.id) || state.p2.bans.includes(pet.id) || state.pubBans.includes(pet.id) || state.ladderBans.includes(pet.id);
                const inHistory = isPetInHistory(pet.id);
                let cls = 'pool-pet';
                if (isPicked || isBanned || inHistory) cls += ' used';
                if (state.deleteMode && pet.userAdded) {
                    cls += ' deletable';
                }
                const draggable = !isPicked && !isBanned && !inHistory && !state.deleteMode;
                html += `<div class="${cls}" data-pet-id="${pet.id}" title="${pet.name} (编号:${pet.number})" draggable="${draggable?'true':'false'}">
                    <img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">
                    <span class="pet-name">${pet.name}</span>
                    <span class="delete-icon"></span>
                </div>`;
            });
            html += `</div></div>`;
        });
    }

    elPoolGroups.innerHTML = html;

    const totalAll = state.allPets.length;
    const usedCount = state.allPets.filter(p => {
        const isPicked = state.p1.picks.includes(p.id) || state.p2.picks.includes(p.id);
        const isBanned = state.p1.bans.includes(p.id) || state.p2.bans.includes(p.id) || state.pubBans.includes(p.id) || state.ladderBans.includes(p.id);
        return isPicked || isBanned || isPetInHistory(p.id);
    }).length;
    elRemainCount.textContent = `剩余: ${totalAll - usedCount}`;
}

function renderAll() {
    renderBanSlots();
    renderPickSlots();
    renderPool();
    renderCounts();
    renderHistory();
    updateHistoryCount();
    updateMagicSummary();
    updateLadderMagic();
    updateFilterIndicator();
}

function renderBanSlots() {
    renderBanGroup(elBanSlots1, state.p1.bans, 'p1-ban');
    renderBanGroup(elBanSlots2, state.p2.bans, 'p2-ban');
    renderBanGroup(elBanSlotsPub, state.pubBans, 'pub-ban');
    renderBanGroup(elBanSlotsLadder, state.ladderBans, 'ladder-ban');
}

function renderBanGroup(container, banIds, groupType) {
    const limit = getSlotLimit(groupType);
    container.innerHTML = '';
    for (let i = 0; i < limit; i++) {
        const slot = document.createElement('div');
        slot.className = 'ban-slot';
        slot.dataset.index = i;
        container.appendChild(slot);
    }
    const slots = container.querySelectorAll('.ban-slot');
    slots.forEach((slot, idx) => {
        const petId = banIds[idx] || null;
        if (petId) {
            const pet = getPet(petId);
            if (pet) {
                slot.className = 'ban-slot filled';
                let html = `<img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">`;
                if (groupType !== 'pub-ban' && groupType !== 'ladder-ban') {
                    html += `<span class="ban-mark">✕</span>`;
                } else if (groupType === 'pub-ban') {
                    const fromP1 = state.p1.bans.includes(petId);
                    const fromP2 = state.p2.bans.includes(petId);
                    if (fromP1 || fromP2) html += `<span class="from-player">${fromP1?'P1':'P2'}</span>`;
                }
                slot.innerHTML = html;
            }
        } else {
            slot.className = 'ban-slot';
            slot.innerHTML = '';
        }
    });
}

function renderPickSlots() {
    renderPickGroup(elPickSlots1, state.p1.picks, 'p1-pick');
    renderPickGroup(elPickSlots2, state.p2.picks, 'p2-pick');
}

function renderPickGroup(container, pickIds, groupType) {
    const slots = container.querySelectorAll('.pick-slot');
    while (slots.length < MAX_PICK) {
        const newSlot = document.createElement('div');
        newSlot.className = 'pick-slot';
        newSlot.dataset.index = slots.length;
        container.appendChild(newSlot);
    }
    const allSlots = container.querySelectorAll('.pick-slot');
    allSlots.forEach((slot, idx) => {
        const petId = pickIds[idx] || null;
        if (petId) {
            const pet = getPet(petId);
            if (pet) {
                slot.className = 'pick-slot filled';
                const isLeft = groupType === 'p1-pick';
                const magicHtml = `<span class="pick-value">${pet.magic}</span>`;
                slot.innerHTML = `
                    ${isLeft ? magicHtml : ''}
                    <img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">
                    ${!isLeft ? magicHtml : ''}
                `;
            }
        } else {
            slot.className = 'pick-slot';
            slot.innerHTML = `<span class="empty-hint">—</span>`;
        }
    });
}

function renderCounts() {
    elBanCount1.textContent = state.p1.bans.length;
    elBanCount2.textContent = state.p2.bans.length;
    elBanCountPub.textContent = state.pubBans.length;
    elBanCountLadder.textContent = state.ladderBans.length;
    elPickCount1.textContent = `${state.p1.picks.length}/${MAX_PICK}`;
    elPickCount2.textContent = `${state.p2.picks.length}/${MAX_PICK}`;
}

function renderHistory() {
    let leftHtml = '', rightHtml = '';
    if (state.history.length === 0) {
        leftHtml = rightHtml = '<div class="history-empty">暂无</div>';
    } else {
        const records = [...state.history].reverse();
        records.forEach((record, idx) => {
            const num = state.history.length - idx;
            const time = record.timestamp || '';
            const recordHtml = (picks) => {
                let petsHtml = '';
                if (picks) {
                    picks.forEach(pid => {
                        const pet = getPet(pid);
                        if (pet) petsHtml += `<div class="history-pet" title="${pet.name}"><img src="${pet.imageSourceUrl}" alt=""></div>`;
                    });
                }
                return `
                    <div class="history-record">
                        <div class="record-header">
                            <span class="record-num">第${num}局</span>
                            <span>${time}</span>
                        </div>
                        <div class="history-pets">${petsHtml}</div>
                    </div>
                `;
            };
            leftHtml += recordHtml(record.p1Picks);
            rightHtml += recordHtml(record.p2Picks);
        });
    }
    elHistoryLeftContent.innerHTML = leftHtml;
    elHistoryRightContent.innerHTML = rightHtml;
}

function updateHistoryCount() {
    elHistoryCount.textContent = state.history.length;
}

function updateMagicSummary() {
    if (state.bpMode === 'magic') {
        const sum1 = calcMagicSum(state.p1.picks);
        const sum2 = calcMagicSum(state.p2.picks);
        const badge1 = document.getElementById('pickCount1');
        const badge2 = document.getElementById('pickCount2');
        if (badge1) badge1.innerHTML = `${state.p1.picks.length}/6 ⭐：<span class="${sum1>16?'over':''}">${sum1}</span>/16`;
        if (badge2) badge2.innerHTML = `${state.p2.picks.length}/6 ⭐：<span class="${sum2>16?'over':''}">${sum2}</span>/16`;
        magicSummary1.style.display = 'none';
        magicSummary2.style.display = 'none';
    } else {
        const badge1 = document.getElementById('pickCount1');
        const badge2 = document.getElementById('pickCount2');
        if (badge1) badge1.textContent = `${state.p1.picks.length}/6`;
        if (badge2) badge2.textContent = `${state.p2.picks.length}/6`;
        magicSummary1.style.display = 'none';
        magicSummary2.style.display = 'none';
    }
}

function syncNames() {
    const p1Input = document.getElementById('p1PickName');
    const p2Input = document.getElementById('p2PickName');
    const historyTitleLeft = document.getElementById('historyTitleLeft');
    const historyTitleRight = document.getElementById('historyTitleRight');
    const sideBtnP1 = document.getElementById('sideBtnP1');
    const sideBtnP2 = document.getElementById('sideBtnP2');

    if (p1Input) {
        const n1 = p1Input.value.trim() || 'P1';
        banName1.textContent = n1;
        if (historyTitleLeft) historyTitleLeft.textContent = `📜 ${n1}`;
        if (sideBtnP1) sideBtnP1.textContent = n1;
    }
    if (p2Input) {
        const n2 = p2Input.value.trim() || 'P2';
        banName2.textContent = n2;
        if (historyTitleRight) historyTitleRight.textContent = `📜 ${n2}`;
        if (sideBtnP2) sideBtnP2.textContent = n2;
    }
}

function syncBanLimits() {
    state.banLimits.p1 = parseInt(banLimit1.value) || 0;
    state.banLimits.p2 = parseInt(banLimit2.value) || 0;
    state.banLimits.pub = parseInt(banLimitPub.value) || 0;
    state.banLimits.ladder = parseInt(banLimitLadder.value) || 0;
    if (state.banLimits.p1 > 6) state.banLimits.p1 = 6;
    if (state.banLimits.p2 > 6) state.banLimits.p2 = 6;
    if (state.banLimits.pub > 4) state.banLimits.pub = 4;
    if (state.banLimits.ladder > 20) state.banLimits.ladder = 20;
    ['p1','p2'].forEach(p => {
        const bans = state[p].bans;
        if (bans.length > state.banLimits[p]) {
            const removed = bans.splice(state.banLimits[p]);
            removed.forEach(id => { state.location[id] = { type: 'pool' }; });
        }
    });
    if (state.pubBans.length > state.banLimits.pub) {
        const removed = state.pubBans.splice(state.banLimits.pub);
        removed.forEach(id => { state.location[id] = { type: 'pool' }; });
    }
    if (state.ladderBans.length > state.banLimits.ladder) {
        const removed = state.ladderBans.splice(state.banLimits.ladder);
        removed.forEach(id => { state.location[id] = { type: 'pool' }; });
    }
    renderAll();
}

function syncMode() {
    applyMode();
}

function updateFilterIndicator() {
    if (POOL_STATE.filterMagic > 0) {
        poolFilterBtn.textContent = `筛选: ${POOL_STATE.filterMagic}★`;
        filterIndicator.textContent = `⭐ ${POOL_STATE.filterMagic}★`;
        filterIndicator.style.display = 'inline';
        poolFilterBtn.classList.add('active');
    } else {
        poolFilterBtn.textContent = '筛选: 全部';
        if (POOL_STATE.searchQuery.trim()) {
            filterIndicator.textContent = `🔍 "${POOL_STATE.searchQuery.trim()}"`;
            filterIndicator.style.display = 'inline';
        } else {
            filterIndicator.textContent = '';
            filterIndicator.style.display = 'none';
        }
        poolFilterBtn.classList.remove('active');
    }
}

function performSearch() {
    POOL_STATE.searchQuery = poolSearchInput.value || '';
    renderAll();
    elStatusMsg.textContent = POOL_STATE.searchQuery ? `🔍 搜索: "${POOL_STATE.searchQuery}"` : '🔍 已清除搜索';
}

let tempFilterMagic = 0;
function openFilterModal() {
    tempFilterMagic = POOL_STATE.filterMagic;
    document.querySelectorAll('#filterOptions button').forEach(btn => {
        const val = parseInt(btn.dataset.magic);
        btn.classList.toggle('active', val === tempFilterMagic);
    });
    filterOverlay.classList.add('active');
}
function closeFilterModal() { filterOverlay.classList.remove('active'); }
function applyFilter() {
    POOL_STATE.filterMagic = tempFilterMagic;
    closeFilterModal();
    renderAll();
    elStatusMsg.textContent = POOL_STATE.filterMagic > 0 ? `⭐ 已筛选: ${POOL_STATE.filterMagic}★` : '⭐ 已清除筛选';
}
function clearFilter() {
    POOL_STATE.filterMagic = 0;
    tempFilterMagic = 0;
    document.querySelectorAll('#filterOptions button').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.magic) === 0);
    });
    closeFilterModal();
    renderAll();
    elStatusMsg.textContent = '⭐ 已清除筛选';
}

function openAddPetModal() {
    addPetMagic.value = 3;
    addPetName.value = '';
    addPetId.value = '';
    addPetOverlay.classList.add('active');
}
function closeAddPetModal() { addPetOverlay.classList.remove('active'); }
function submitAddPet() {
    const magic = parseInt(addPetMagic.value);
    const name = addPetName.value.trim();
    const number = parseInt(addPetId.value.trim());

    if (!name) { showToast('请输入宠物名', 'warning'); return; }
    if (isNaN(number) || number < 1) { showToast('请输入有效的数字编号', 'warning'); return; }
    if (isNaN(magic) || magic < 1 || magic > 5) { showToast('魔力值请输入1-5的数字', 'warning'); return; }
    if (state.allPets.some(p => p.number === number)) {
        showToast(`编号 ${number} 已存在，请使用其他编号`, 'warning');
        return;
    }

    const newId = `m${magic}-${number}`;
    const imageUrl = `https://res.17roco.qq.com/res/combat/icons/${number}-.png`;

    const newPet = {
        id: newId,
        name: name,
        magic: magic,
        number: number,
        imageSourceUrl: imageUrl,
        aliases: [name],
        category: '用户添加',
        avatarStatus: '已同步',
        userAdded: true,
    };

    state.allPets.push(newPet);
    state.location[newId] = { type: 'pool' };

    closeAddPetModal();
    renderAll();
    showToast(`✅ 已添加宠物: ${name} (编号:${number})`, 'success');
    elStatusMsg.textContent = `✅ 已添加: ${name}`;
}

function toggleDeleteMode() {
    state.deleteMode = !state.deleteMode;
    poolDeleteBtn.classList.toggle('delete-mode', state.deleteMode);
    poolDeleteBtn.textContent = state.deleteMode ? '退出删除' : '🗑 删除';
    renderAll();
    elStatusMsg.textContent = state.deleteMode ? '⚠️ 点击宠物卡片可删除（仅限自定义宠物）' : '已退出删除模式';
}

document.addEventListener('click', function(e) {
    if (!state.deleteMode) return;
    const petEl = e.target.closest('.pool-pet.deletable');
    if (!petEl) return;
    const petId = petEl.dataset.petId;
    const pet = getPet(petId);
    if (!pet) return;
    if (confirm(`确定要删除宠物 "${pet.name}" (编号:${pet.number}) 吗？`)) {
        const index = state.allPets.findIndex(p => p.id === petId);
        if (index === -1) return;
        state.allPets.splice(index, 1);
        delete state.location[petId];
        ['p1','p2'].forEach(p => {
            ['bans','picks'].forEach(arr => {
                const idx = state[p][arr].indexOf(petId);
                if (idx > -1) state[p][arr].splice(idx, 1);
            });
        });
        ['pubBans','ladderBans'].forEach(arr => {
            const idx = state[arr].indexOf(petId);
            if (idx > -1) state[arr].splice(idx, 1);
        });
        state.deleteMode = false;
        poolDeleteBtn.classList.remove('delete-mode');
        poolDeleteBtn.textContent = '🗑 删除';
        renderAll();
        showToast(`已删除 "${pet.name}"`, 'success');
        elStatusMsg.textContent = `🗑 已删除: ${pet.name}`;
    }
});

function showToast(msg, type) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    if (type === 'warning') toast.style.background = 'rgba(200,80,50,0.85)';
    else if (type === 'success') toast.style.background = 'rgba(50,150,80,0.85)';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2400);
}

// ================================================================
// 初始化
// ================================================================
function init() {
    document.addEventListener('input', function(e) {
        if (e.target.classList.contains('player-name-input')) {
            syncNames();
        }
    });

    banLimit1.addEventListener('change', syncBanLimits);
    banLimit2.addEventListener('change', syncBanLimits);
    banLimitPub.addEventListener('change', syncBanLimits);
    banLimitLadder.addEventListener('change', syncBanLimits);
    bpModeSelect.addEventListener('change', syncMode);

    elBtnUndo.addEventListener('click', undo);
    elBtnReset.addEventListener('click', resetAll);
    elBtnSave.addEventListener('click', saveCurrentLineup);
    elBtnClearHistory.addEventListener('click', clearHistory);
    btnToggleHistory.addEventListener('click', toggleHistory);
    btnSwapHistory.addEventListener('click', swapHistorySides);
    ladderLockToggle.addEventListener('click', toggleLadderLock);

    sideGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        setSide(btn.dataset.side);
    });
    selectModeGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        setSelectMode(btn.dataset.mode);
    });

    settingsToggle.addEventListener('click', () => {
        settingsOverlay.classList.toggle('active');
    });
    settingsClose.addEventListener('click', () => {
        settingsOverlay.classList.remove('active');
    });
    settingsOverlay.addEventListener('click', (e) => {
        if (e.target === settingsOverlay) settingsOverlay.classList.remove('active');
    });

    themeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            setTheme(btn.dataset.theme);
        });
    });

    poolSearchBtn.addEventListener('click', performSearch);
    poolSearchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });
    let searchTimer;
    poolSearchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(performSearch, 300);
    });

    poolFilterBtn.addEventListener('click', openFilterModal);
    document.querySelectorAll('#filterOptions button').forEach(btn => {
        btn.addEventListener('click', () => {
            const val = parseInt(btn.dataset.magic);
            tempFilterMagic = val;
            document.querySelectorAll('#filterOptions button').forEach(b => {
                b.classList.toggle('active', parseInt(b.dataset.magic) === val);
            });
        });
    });
    filterApplyBtn.addEventListener('click', applyFilter);
    filterClearBtn.addEventListener('click', clearFilter);
    filterOverlay.addEventListener('click', (e) => {
        if (e.target === filterOverlay) closeFilterModal();
    });

    poolAddBtn.addEventListener('click', openAddPetModal);
    addPetSubmit.addEventListener('click', submitAddPet);
    addPetCancel.addEventListener('click', closeAddPetModal);
    addPetOverlay.addEventListener('click', (e) => {
        if (e.target === addPetOverlay) closeAddPetModal();
    });
    addPetId.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitAddPet();
    });
    addPetName.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitAddPet();
    });
    addPetMagic.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitAddPet();
    });

    poolDeleteBtn.addEventListener('click', toggleDeleteMode);

    loadTheme();
    const savedLock = localStorage.getItem('ladderLocked');
    if (savedLock !== null) {
        state.ladderLocked = JSON.parse(savedLock);
    } else {
        state.ladderLocked = false;
    }
    updateLockUI();
    syncBanLimits();
    syncMode();
    renderAll();
    initDragDrop();

    function adjustZoom() {
        const idealWidth = 1000;
        const minZoom = 0.5;
        const maxZoom = 1.8;
        let zoom = window.innerWidth / idealWidth;
        zoom = Math.min(Math.max(zoom, minZoom), maxZoom);
        document.documentElement.style.zoom = zoom;
    }
    window.addEventListener('resize', adjustZoom);
    window.addEventListener('load', adjustZoom);
}

document.addEventListener('DOMContentLoaded', init);
</script>
