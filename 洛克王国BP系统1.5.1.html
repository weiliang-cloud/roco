<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国征召</title>
    <style>
        :root {
            --primary: #d4a030;
            --primary-dark: #b8860b;
            --primary-light: rgba(212, 175, 55, 0.2);
            --bg-body: #e8edf5;
            --bg-container: rgba(255, 255, 255, 0.85);
            --border-color: rgba(200, 180, 140, 0.3);
            --ban-bg: rgba(245, 240, 235, 0.6);
            --pick-bg: rgba(245, 240, 235, 0.5);
            --pool-bg: rgba(245, 240, 235, 0.4);
            --text-muted: rgba(80, 70, 50, 0.5);
            --text-dark: #555;
            --shadow: 0 12px 40px rgba(0,0,0,0.06);
            --radius: 20px;
            --transition: 0.3s ease;
        }
        [data-theme="dark"] {
            --bg-body: #1a1a2e;
            --bg-container: rgba(30,30,50,0.92);
            --text-dark: #ddd;
            --text-muted: rgba(200,200,200,0.6);
            --primary: #e6b800;
            --primary-dark: #cc9900;
            --primary-light: rgba(230,184,0,0.25);
            --border-color: rgba(255,255,255,0.15);
            --ban-bg: rgba(50,50,70,0.6);
            --pick-bg: rgba(50,50,70,0.5);
            --pool-bg: rgba(50,50,70,0.4);
            --shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        [data-theme="pink"] {
            --bg-body: #fdf0f0;
            --bg-container: rgba(255,245,245,0.92);
            --text-dark: #6a4e4e;
            --text-muted: rgba(106,78,78,0.5);
            --primary: #d48a8a;
            --primary-dark: #b86a6a;
            --primary-light: rgba(212,138,138,0.2);
            --border-color: rgba(180,130,130,0.25);
            --ban-bg: rgba(245,225,225,0.6);
            --pick-bg: rgba(245,225,225,0.5);
            --pool-bg: rgba(245,225,225,0.4);
            --shadow: 0 12px 40px rgba(0,0,0,0.06);
        }
        [data-theme="blue"] {
            --bg-body: #eef5ff;
            --bg-container: rgba(240,248,255,0.92);
            --text-dark: #2c3e50;
            --text-muted: rgba(44,62,80,0.5);
            --primary: #5b9bd5;
            --primary-dark: #4a7db0;
            --primary-light: rgba(91,155,213,0.2);
            --border-color: rgba(100,150,200,0.2);
            --ban-bg: rgba(230,242,255,0.6);
            --pick-bg: rgba(230,242,255,0.5);
            --pool-bg: rgba(230,242,255,0.4);
            --shadow: 0 12px 40px rgba(0,0,0,0.06);
        }
        [data-theme="green"] {
            --bg-body: #f0f8f0;
            --bg-container: rgba(240,255,240,0.92);
            --text-dark: #2e4a2e;
            --text-muted: rgba(46,74,46,0.5);
            --primary: #6bb86b;
            --primary-dark: #4d9a4d;
            --primary-light: rgba(107,184,107,0.2);
            --border-color: rgba(100,180,100,0.2);
            --ban-bg: rgba(230,245,230,0.6);
            --pick-bg: rgba(230,245,230,0.5);
            --pool-bg: rgba(230,245,230,0.4);
            --shadow: 0 12px 40px rgba(0,0,0,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Microsoft YaHei','PingFang SC',Arial,sans-serif;
            background: var(--bg-body);
            background-image: radial-gradient(ellipse at 20% 50%, #d6e0f0 0%, var(--bg-body) 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            background-attachment: scroll;
            transition: background var(--transition), background-image var(--transition);
        }
        .bp-container {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-container);
            border-radius: var(--radius);
            padding: 16px 20px 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }
        .bp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .bp-title h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .bp-title .subtitle { font-size: 11px; color: var(--text-muted); margin-left: 6px; }
        .history-info { font-size: 12px; color: var(--text-muted); background: var(--primary-light); padding: 2px 12px; border-radius: 16px; border:1px solid var(--border-color); }
        .history-info span { font-weight:600; color:var(--primary-dark); }
        .mode-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-dark);
        }
        .mode-selector label { display: flex; align-items: center; gap: 4px; cursor:pointer; }
        .mode-selector select, .mode-selector input[type="checkbox"] {
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 12px;
            outline: none;
            color: var(--text-dark);
        }
        .mode-selector select:focus, .mode-selector input:focus { border-color: var(--primary); }
        .mode-selector .btn-group {
            display: inline-flex;
            gap: 2px;
            background: rgba(200,190,180,0.15);
            border-radius: 6px;
            padding: 2px;
        }
        .mode-selector .btn-group button {
            border: none;
            background: transparent;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .mode-selector .btn-group button.active {
            background: var(--primary);
            color: #fff;
        }
        .mode-selector .btn-group button:hover:not(.active) {
            background: var(--primary-light);
        }
        .settings-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            color: var(--text-muted);
            transition: color var(--transition);
        }
        .settings-btn:hover { color: var(--primary); }

        .main-area {
            display: grid;
            grid-template-columns: 120px 1fr 120px;
            gap: 12px;
            margin-bottom: 12px;
            transition: grid-template-columns var(--transition);
            min-height: 0;
        }
        .main-area.hide-history {
            grid-template-columns: 1fr !important;
        }
        .main-area.hide-history .history-panel { display: none !important; }
        .main-area.ladder-mode {
            grid-template-columns: 1fr !important;
        }
        .main-area.ladder-mode .history-panel { display: none !important; }

        .center-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .ban-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
            transition: grid-template-columns var(--transition);
        }
        .ban-row.ladder-mode {
            grid-template-columns: 1fr;
        }
        .ban-row.ladder-mode .ban-group:not(.ladder-ban) { display: none; }
        .ban-group.ladder-ban { display: none; }
        .ban-row.ladder-mode .ban-group.ladder-ban { display: block; }

        .ban-group {
            background: var(--ban-bg);
            border-radius: 10px;
            padding: 6px 8px 8px;
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
            min-height: 60px;
        }
        .ban-group.drag-over { background: var(--primary-light); border-color: var(--primary); }
        .ban-group .ban-label {
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }
        .ban-group .ban-label .count { color: rgba(180,150,80,0.5); font-size:8px; }
        .ban-group .ban-label .limit-input {
            width: 32px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(160,150,140,0.2);
            font-size: 10px;
            text-align: center;
            color: var(--text-dark);
            outline: none;
        }
        .ban-group .ban-label .limit-input:focus { border-color: var(--primary); }
        .ban-group .ban-label .lock-btn {
            cursor: pointer;
            font-size: 12px;
            margin-left: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .ban-group .ban-label .lock-btn:hover { color: var(--primary); }
        .ban-group .ban-label .lock-btn.locked { color: var(--primary); }

        .ban-slots {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            min-height: 32px;
        }
        .ban-slot {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(200,190,180,0.15);
            border: 1.5px dashed rgba(160,150,140,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .ban-slot.filled { border-style: solid; border-color: var(--primary); background: var(--primary-light); }
        .ban-slot img { width: 24px; height: 24px; object-fit: contain; border-radius: 3px; }
        .ban-slot .ban-mark { position: absolute; top:-3px; right:-3px; font-size:10px; color:#d9534f; }
        .ban-slot .from-player { font-size:5px; position:absolute; bottom:0; right:1px; color:var(--text-muted); background:rgba(255,255,255,0.4); padding:0 2px; border-radius:2px; }
        .ban-group.public .ban-slots { justify-content:center; }
        .ban-group.public .ban-label { color: rgba(180,150,80,0.7); }

        .pick-row {
            display: grid;
            grid-template-columns: 1fr 5fr 1fr;
            gap: 14px;
            align-items: stretch;
            min-height: 100vh;
            transition: grid-template-columns var(--transition);
        }
        .pick-row.ladder-mode {
            grid-template-columns: 1fr 9fr;
        }
        .pick-row.ladder-mode .pick-group.player2 { display: none; }
        .pick-row.ladder-mode .pick-group.player1 .player-name-input { display: none !important; }

        .pick-group {
            background: var(--pick-bg);
            border-radius: 10px;
            padding: 6px 8px 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: background var(--transition), border-color var(--transition);
            min-height: 0;
            max-height: 410px;
        }
        .pick-group.drag-over { background: var(--primary-light); border-color: var(--primary); }
        .pick-group .pick-label {
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 4px;
            flex-shrink: 0;
        }
        .pick-group .pick-label .badge {
            font-size:8px;
            background:var(--primary-light);
            padding:0 6px;
            border-radius:12px;
            color:rgba(180,150,80,0.5);
        }
        .pick-group.player1 .pick-label { color: rgba(50,130,200,0.6); }
        .pick-group.player2 .pick-label { color: rgba(200,80,80,0.6); }
        .pick-group .magic-summary {
            font-size: 10px;
            font-weight: 600;
            color: rgba(180,150,80,0.5);
            text-align: center;
            margin: 2px 0;
            flex-shrink: 0;
        }
        .pick-group .magic-summary .over { color: #d9534f; }

        .pick-slots {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 0;
        }
        .pick-slot {
            flex: 1;
            width: 100%;
            min-height: 0;
            border-radius: 8px;
            background: rgba(200,190,180,0.1);
            border: 1.5px dashed rgba(160,150,140,0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            box-sizing: border-box;
        }
        .pick-slot.filled {
            border-style: solid;
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .pick-slot img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .pick-slot .pick-value {
            font-size: 12px;
            font-weight: 700;
            color: rgba(180,150,80,0.6);
        }
        .pick-slot .empty-hint { font-size:12px; color:rgba(160,150,140,0.2); margin:0 auto; }

        .pet-pool {
            background: var(--pool-bg);
            border-radius: 10px;
            padding: 6px 8px 8px;
            border: 1px solid var(--border-color);
            max-height: 410px;
            overflow-y: auto;
            min-width: 0;
            transition: background var(--transition), border-color var(--transition);
            display: flex;
            flex-direction: column;
        }
        .pet-pool::-webkit-scrollbar { width:3px; }
        .pet-pool::-webkit-scrollbar-thumb { background:rgba(180,150,80,0.15); border-radius:6px; }

        .pool-title {
            font-size: 9px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .pool-title .remain { color: rgba(180,150,80,0.3); }

        .pool-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
            align-items: center;
        }
        .pool-toolbar .search-wrap {
            display: flex;
            flex: 1;
            min-width: 100px;
            gap: 4px;
        }
        .pool-toolbar .search-wrap input {
            flex: 1;
            min-width: 60px;
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 10px;
            outline: none;
            color: var(--text-dark);
        }
        .pool-toolbar .search-wrap input:focus { border-color: var(--primary); }
        .pool-toolbar .search-wrap button,
        .pool-toolbar .tool-btn {
            border: none;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
            background: rgba(200,190,180,0.15);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            transition: 0.2s;
            white-space: nowrap;
        }
        .pool-toolbar .search-wrap button:hover,
        .pool-toolbar .tool-btn:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
            border-color: var(--primary);
        }
        .pool-toolbar .tool-btn.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-dark);
        }
        .pool-toolbar .filter-indicator {
            font-size: 8px;
            color: var(--primary-dark);
            margin-left: 2px;
        }
        .pool-toolbar .tool-btn.delete-mode {
            background: #d9534f;
            color: #fff;
            border-color: #d9534f;
        }
        .pool-toolbar .tool-btn.delete-mode:hover {
            background: #c9302c;
        }
        .pool-toolbar .clear-filter {
            font-size: 8px;
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
            padding: 0 2px;
        }
        .pool-toolbar .clear-filter:hover { color: #d9534f; }

        .pool-groups-wrap {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        .pool-groups-wrap::-webkit-scrollbar { width:3px; }
        .pool-groups-wrap::-webkit-scrollbar-thumb { background:rgba(180,150,80,0.15); border-radius:6px; }

        .pool-group { margin-bottom: 4px; }
        .pool-group .group-label {
            font-size: 10px;
            font-weight: 700;
            color: rgba(180,150,80,0.4);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pool-group .group-label .line { flex: 1; height: 1px; background: var(--border-color); }
        .pool-items {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
        }
        .pool-pet {
            width: 44px;
            height: 52px;
            border-radius: 8px;
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.15s;
            padding: 2px;
            gap: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
            position: relative;
        }
        .pool-pet:hover:not(.used):not(.history-used):not(.deletable) {
            transform: translateY(-2px);
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .pool-pet img { width: 36px; height: 36px; object-fit: contain; border-radius: 4px; pointer-events: none; }
        .pool-pet .pet-name {
            font-size: 7px;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            max-width: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            margin-top: 1px;
        }
        .pool-pet.used {
            opacity: 0.2;
            cursor: not-allowed;
            filter: grayscale(0.9);
            transform: scale(0.9);
            border-color: rgba(200,80,80,0.1);
        }
        .pool-pet.history-used {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(0.7);
            transform: scale(0.92);
            border-color: rgba(180,150,80,0.2);
            border-style: dashed;
        }
        .pool-pet.used::after, .pool-pet.history-used::after {
            content: '✕';
            position: absolute;
            font-size: 12px;
            color: rgba(200,80,80,0.25);
        }
        .pool-pet.dragging { opacity: 0.4; transform: scale(0.95); }
        .pool-pet.deletable {
            cursor: pointer;
            border-color: #d9534f;
            background: rgba(217,83,79,0.05);
        }
        .pool-pet.deletable:hover {
            border-color: #d9534f;
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(217,83,79,0.15);
        }
        .pool-pet .delete-icon {
            display: none;
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            background: #d9534f;
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            font-weight: 700;
            pointer-events: none;
            z-index: 5;
        }
        .pool-pet.deletable .delete-icon {
            display: block;
        }
        .pool-pet .delete-icon::before {
            content: '✕';
        }

        .history-panel {
            background: var(--ban-bg);
            border-radius: 10px;
            padding: 6px 4px;
            border: 1px solid var(--border-color);
            max-height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: background var(--transition), border-color var(--transition);
            min-height: 0;
        }
        .history-panel::-webkit-scrollbar { width:3px; }
        .history-panel::-webkit-scrollbar-thumb { background:rgba(180,150,80,0.15); border-radius:6px; }
        .history-panel .panel-title {
            font-size:8px;
            color:var(--text-muted);
            text-align:center;
            letter-spacing:0.5px;
            border-bottom:1px solid var(--border-color);
            padding-bottom:3px;
            flex-shrink:0;
        }
        .history-record {
            background:rgba(255,255,255,0.3);
            border-radius:6px;
            padding:4px 4px 4px;
            border:1px solid var(--border-color);
            flex-shrink:0;
        }
        .history-record .record-header {
            font-size:7px;
            color:var(--text-muted);
            display:flex;
            justify-content:space-between;
            padding:0 2px 2px;
            border-bottom:1px dashed var(--border-color);
        }
        .history-record .record-num { font-weight:600; color:rgba(180,150,80,0.4); }
        .history-pets {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: space-between;
            margin-top: 2px;
        }
        .history-pet {
            width: calc(33.33% - 4px);
            height: 32px;
            border-radius: 4px;
            background: rgba(255,255,255,0.4);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex: 0 0 auto;
        }
        .history-pet img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }
        .history-empty { text-align:center; color:var(--text-muted); font-size:10px; padding:20px 0; }

        .bp-controls {
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            padding-top:12px;
            border-top:1px solid var(--border-color);
            flex-wrap:wrap;
        }
        .bp-controls button {
            padding:2px 10px;
            border:none;
            border-radius:14px;
            font-size:9px;
            font-weight:600;
            cursor:pointer;
            transition:0.2s;
            background:rgba(200,190,180,0.15);
            color:var(--text-muted);
            border:1px solid var(--border-color);
        }
        .bp-controls button:hover:not(:disabled) {
            background:var(--primary-light);
            color:var(--primary-dark);
            border-color:var(--primary);
        }
        .bp-controls button:disabled { opacity:0.2; cursor:not-allowed; }
        .bp-controls button.primary {
            background:linear-gradient(135deg, var(--primary-light), rgba(184,134,11,0.06));
            color:var(--primary-dark);
        }
        .bp-controls button.primary:hover:not(:disabled) {
            background:linear-gradient(135deg, rgba(212,175,55,0.2), rgba(184,134,11,0.1));
        }
        .bp-controls button.danger { color:#d9534f; }
        .bp-controls button.danger:hover:not(:disabled) { background:rgba(217,83,79,0.06); }
        .bp-controls .status-msg {
            font-size:8px;
            color:var(--text-muted);
            min-width:80px;
            text-align:center;
        }

        .player-name-input {
            background:transparent;
            border:none;
            border-bottom:1px solid var(--border-color);
            font-size:10px;
            font-weight:600;
            padding:0 2px;
            width:50px;
            outline:none;
            color:inherit;
        }
        .pick-group.player1 .player-name-input { color:rgba(50,130,200,0.8); }
        .pick-group.player2 .player-name-input { color:rgba(200,80,80,0.8); }

        .settings-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .settings-overlay.active { display: flex; }
        .settings-panel {
            background: #fff;
            padding: 24px 28px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }
        .settings-panel h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--text-dark);
        }
        .settings-panel .theme-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .settings-panel .theme-options button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
            width: 44px;
            height: 44px;
        }
        .settings-panel .theme-options button:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .settings-panel .theme-options button.active {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 2px var(--primary);
        }
        .settings-panel .theme-options button .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
        }
        .settings-panel .close-btn {
            margin-top: 16px;
            padding: 6px 20px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .settings-panel .close-btn:hover { background: var(--primary-dark); }

        /* 筛选弹窗 & 添加宠物弹窗 */
        .filter-overlay, .add-pet-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .filter-overlay.active, .add-pet-overlay.active { display: flex; }
        .filter-panel, .add-pet-panel {
            background: #fff;
            padding: 20px 24px;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            max-width: 380px;
            width: 90%;
        }
        .filter-panel h3, .add-pet-panel h3 {
            font-size: 16px;
            margin-bottom: 14px;
            color: var(--text-dark);
            text-align: center;
        }
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .filter-options button {
            padding: 6px 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
            min-width: 48px;
        }
        .filter-options button:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .filter-options button.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary-dark);
        }
        .filter-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }
        .filter-actions button {
            padding: 5px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .filter-actions .btn-apply {
            background: var(--primary);
            color: #fff;
        }
        .filter-actions .btn-apply:hover { background: var(--primary-dark); }
        .filter-actions .btn-clear-filter {
            background: rgba(200,190,180,0.15);
            color: var(--text-muted);
        }
        .filter-actions .btn-clear-filter:hover { background: rgba(217,83,79,0.1); color: #d9534f; }

        .add-pet-panel .form-group {
            margin-bottom: 12px;
        }
        .add-pet-panel .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .add-pet-panel .form-group input,
        .add-pet-panel .form-group select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: rgba(255,255,255,0.6);
            color: var(--text-dark);
        }
        .add-pet-panel .form-group input:focus,
        .add-pet-panel .form-group select:focus { border-color: var(--primary); }
        .add-pet-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
        }
        .add-pet-actions button {
            padding: 5px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .add-pet-actions .btn-submit {
            background: var(--primary);
            color: #fff;
        }
        .add-pet-actions .btn-submit:hover { background: var(--primary-dark); }
        .add-pet-actions .btn-cancel {
            background: rgba(200,190,180,0.15);
            color: var(--text-muted);
        }
        .add-pet-actions .btn-cancel:hover { background: rgba(200,190,180,0.3); }

        @media (max-width: 820px) {
            .main-area { grid-template-columns: 1fr; gap:8px; min-height:auto; }
            .history-panel { max-height:200px; }
            .ban-row { grid-template-columns:1fr 1fr 1fr; }
            .ban-row.ladder-mode { grid-template-columns:1fr; }
            .pick-row { grid-template-columns:1fr; gap:8px; }
            .pick-row.ladder-mode { grid-template-columns:1fr; }
            .pick-row.ladder-mode .pick-group.player2 { display:none; }
            .pick-slot { max-width:100%; }
            .pet-pool { max-height:200px; }
            .pool-toolbar .search-wrap { min-width:80px; }
        }
        @media (max-width: 600px) {
            .mode-selector { flex-direction:column; align-items:flex-start; }
            .bp-header { flex-direction:column; align-items:stretch; }
            .pool-toolbar .search-wrap { min-width:60px; }
            .pool-toolbar .search-wrap input { font-size:9px; min-width:40px; }
            .pool-toolbar .search-wrap button,
            .pool-toolbar .tool-btn { font-size:9px; padding:2px 6px; }
        }
        .drop-target { border-color:var(--primary) !important; background:var(--primary-light) !important; box-shadow:0 0 12px rgba(212,175,55,0.06); }
        .toast {
            position:fixed;
            bottom:20px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.7);
            color:#fff;
            padding:6px 20px;
            border-radius:20px;
            font-size:13px;
            z-index:999;
            animation:fadeInOut 2.4s ease forwards;
            pointer-events:none;
        }
        @keyframes fadeInOut {
            0% { opacity:0; transform:translateX(-50%) translateY(10px); }
            15% { opacity:1; transform:translateX(-50%) translateY(0); }
            85% { opacity:1; transform:translateX(-50%) translateY(0); }
            100% { opacity:0; transform:translateX(-50%) translateY(-10px); }
        }
    </style>
</head>
<body>
<div class="bp-container" id="app">
    <div class="bp-header">
        <div class="bp-title">
            <h1>⚔️ 洛克王国征召</h1>
        </div>
        <div class="history-info">📋 已保存 <span id="historyCount">0</span> 局</div>
        <div class="mode-selector">
            <label>模式：
                <select id="bpModeSelect">
                    <option value="normal">常规BP</option>
                    <option value="magic">魔力BP</option>
                    <option value="ladder">天梯赛</option>
                </select>
            </label>
            <span style="display:flex; align-items:center; gap:4px;">
                <span style="font-size:11px; color:var(--text-muted);">玩家：</span>
                <div class="btn-group" id="sideGroup">
                    <button data-side="red" class="active" id="sideBtnP1">P1</button>
                    <button data-side="blue" id="sideBtnP2">P2</button>
                </div>
            </span>
            <span style="display:flex; align-items:center; gap:4px;">
                <span style="font-size:11px; color:var(--text-muted);">模式：</span>
                <div class="btn-group" id="selectModeGroup">
                    <button data-mode="ban" class="active">禁用</button>
                    <button data-mode="select">选择</button>
                </div>
            </span>
            <button class="settings-btn" id="settingsToggle" title="设置">⚙️</button>
        </div>
    </div>

    <div class="main-area" id="mainArea">
        <div class="history-panel" id="historyLeft">
            <div class="panel-title" id="historyTitleLeft">📜 P1</div>
            <div id="historyLeftContent"><div class="history-empty">暂无</div></div>
        </div>

        <div class="center-col">
            <div class="ban-row" id="banRow">
                <div class="ban-group" data-group="p1-ban">
                    <div class="ban-label">
                        <span>🔵 <span id="banName1">P1</span> Ban位</span>
                        <span class="count">
                            <span id="banCount1">0</span>/<input type="number" class="limit-input" id="banLimit1" value="5" min="0" max="6">
                        </span>
                    </div>
                    <div class="ban-slots" id="banSlots1"></div>
                </div>
                <div class="ban-group public" data-group="pub-ban">
                    <div class="ban-label">
                        <span>⭐ 公ban</span>
                        <span class="count">
                            <span id="banCountPub">0</span>/<input type="number" class="limit-input" id="banLimitPub" value="2" min="0" max="4">
                        </span>
                    </div>
                    <div class="ban-slots" id="banSlotsPub"></div>
                </div>
                <div class="ban-group" data-group="p2-ban">
                    <div class="ban-label">
                        <span>🔴 <span id="banName2">P2</span> Ban位</span>
                        <span class="count">
                            <span id="banCount2">0</span>/<input type="number" class="limit-input" id="banLimit2" value="5" min="0" max="6">
                        </span>
                    </div>
                    <div class="ban-slots" id="banSlots2"></div>
                </div>
                <div class="ban-group ladder-ban" data-group="ladder-ban">
                    <div class="ban-label">
                        <span>🚫 天梯禁赛
                            <button class="lock-btn" id="ladderLockToggle" title="锁定禁赛">🔓</button>
                        </span>
                        <span class="count">
                            <span id="banCountLadder">0</span>/<input type="number" class="limit-input" id="banLimitLadder" value="4" min="0" max="20">
                        </span>
                    </div>
                    <div class="ban-slots" id="banSlotsLadder"></div>
                </div>
            </div>

            <div class="pick-row" id="pickRow">
                <div class="pick-group player1" data-group="p1-pick">
                    <div class="pick-label">
                        <span id="player1Label">🔵 <input type="text" class="player-name-input" id="p1PickName" value="P1" maxlength="4"></span>
                        <span class="badge" id="pickCount1">0/6</span>
                    </div>
                    <div class="magic-summary" id="magicSummary1"></div>
                    <div class="pick-slots" id="pickSlots1">
                        <div class="pick-slot" data-index="0"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="1"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="2"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="3"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="4"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="5"><span class="empty-hint">—</span></div>
                    </div>
                </div>

                <div class="pet-pool" id="petPool">
                    <div class="pool-title">
                        <span>🐾 宠物池</span>
                        <span class="remain" id="remainCount">剩余: 0</span>
                    </div>
                    <div class="pool-toolbar">
                        <div class="search-wrap">
                            <input type="text" id="poolSearchInput" placeholder="搜索编号或名称...">
                            <button id="poolSearchBtn">搜索</button>
                        </div>
                        <button class="tool-btn" id="poolFilterBtn">筛选: 全部</button>
                        <button class="tool-btn" id="poolAddBtn">➕ 添加</button>
                        <button class="tool-btn" id="poolDeleteBtn">🗑 删除</button>
                        <span id="filterIndicator" class="filter-indicator"></span>
                    </div>
                    <div class="pool-groups-wrap" id="poolGroupsWrap">
                        <div id="poolGroups"></div>
                    </div>
                </div>

                <div class="pick-group player2" data-group="p2-pick">
                    <div class="pick-label">
                        <span id="player2Label">🔴 <input type="text" class="player-name-input" id="p2PickName" value="P2" maxlength="4"></span>
                        <span class="badge" id="pickCount2">0/6</span>
                    </div>
                    <div class="magic-summary" id="magicSummary2"></div>
                    <div class="pick-slots" id="pickSlots2">
                        <div class="pick-slot" data-index="0"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="1"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="2"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="3"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="4"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="5"><span class="empty-hint">—</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="history-panel" id="historyRight">
            <div class="panel-title" id="historyTitleRight">📜 P2</div>
            <div id="historyRightContent"><div class="history-empty">暂无</div></div>
        </div>
    </div>

    <div class="bp-controls">
        <button class="danger" id="btnReset">⟳ 重置</button>
        <button id="btnUndo" disabled>↩ 撤回</button>
        <button class="primary" id="btnSave">💾 保存</button>
        <button class="danger" id="btnClearHistory" style="font-size:9px;padding:2px 8px;">🗑 清除历史</button>
        <button class="primary" id="btnToggleHistory" style="font-size:9px;padding:2px 8px;">👁 隐藏历史</button>
        <button class="primary" id="btnSwapHistory" style="font-size:9px;padding:2px 8px;">🔄 交换历史阵容</button>
        <span class="status-msg" id="statusMsg">拖拽宠物到目标槽位</span>
    </div>
</div>

<!-- 设置面板 -->
<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
        <h2>🎨 主题色</h2>
        <div class="theme-options">
            <button data-theme="light" class="active">
                <span class="color-swatch" style="background:#e8edf5; border-color:#ccc;"></span>
            </button>
            <button data-theme="dark">
                <span class="color-swatch" style="background:#1a1a2e; border-color:#444;"></span>
            </button>
            <button data-theme="pink">
                <span class="color-swatch" style="background:#fdf0f0; border-color:#d4a0a0;"></span>
            </button>
            <button data-theme="blue">
                <span class="color-swatch" style="background:#eef5ff; border-color:#8ab8d4;"></span>
            </button>
            <button data-theme="green">
                <span class="color-swatch" style="background:#f0f8f0; border-color:#8bc48b;"></span>
            </button>
        </div>
        <button class="close-btn" id="settingsClose">关闭</button>
    </div>
</div>

<!-- 筛选弹窗 -->
<div class="filter-overlay" id="filterOverlay">
    <div class="filter-panel">
        <h3>🔍 筛选魔力值</h3>
        <div class="filter-options" id="filterOptions">
            <button data-magic="0" class="active">全部</button>
            <button data-magic="1">1★</button>
            <button data-magic="2">2★</button>
            <button data-magic="3">3★</button>
            <button data-magic="4">4★</button>
            <button data-magic="5">5★</button>
        </div>
        <div class="filter-actions">
            <button class="btn-apply" id="filterApplyBtn">确定</button>
            <button class="btn-clear-filter" id="filterClearBtn">清除</button>
        </div>
    </div>
</div>

<!-- 添加宠物弹窗 -->
<div class="add-pet-overlay" id="addPetOverlay">
    <div class="add-pet-panel">
        <h3>➕ 添加宠物</h3>
        <div class="form-group">
            <label>魔力值 (1-5)</label>
            <input type="number" id="addPetMagic" min="1" max="5" value="3">
        </div>
        <div class="form-group">
            <label>宠物名</label>
            <input type="text" id="addPetName" placeholder="请输入宠物名">
        </div>
        <div class="form-group">
            <label>编号 (数字)</label>
            <input type="text" id="addPetId" placeholder="输入数字编号">
        </div>
        <div class="add-pet-actions">
            <button class="btn-submit" id="addPetSubmit">添加</button>
            <button class="btn-cancel" id="addPetCancel">取消</button>
        </div>
    </div>
</div>

const processedPets = PETS.map(p => {
    const parts = p.id.split('-');
    const number = parseInt(parts[1]) || 0;
    return {
        ...p,
        number: number,
        userAdded: false,
    };
});

const MAX_PICK = 6;
const DEFAULT_BAN_LIMITS = { p1:5, p2:5, pub:2, ladder:4 };

function loadHistory() {
    try {
        const data = localStorage.getItem('bp_history');
        if (data) {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed)) return parsed;
        }
    } catch(e) {}
    return [];
}

function saveHistory(history) {
    try {
        localStorage.setItem('bp_history', JSON.stringify(history));
    } catch(e) {}
}

function getPet(id) { return state.allPets.find(p => p.id === id); }
function isPetInPool(petId) { return state.location[petId] && state.location[petId].type === 'pool'; }
function getPetLocation(petId) { return state.location[petId] || null; }
function getSlotLimit(type) {
    if (type === 'p1-ban') return state.banLimits.p1;
    if (type === 'p2-ban') return state.banLimits.p2;
    if (type === 'pub-ban') return state.banLimits.pub;
    if (type === 'ladder-ban') return state.banLimits.ladder;
    if (type === 'p1-pick' || type === 'p2-pick') return MAX_PICK;
    return 0;
}
function getSlotCount(type) {
    if (type === 'p1-ban') return state.p1.bans.length;
    if (type === 'p2-ban') return state.p2.bans.length;
    if (type === 'pub-ban') return state.pubBans.length;
    if (type === 'ladder-ban') return state.ladderBans.length;
    if (type === 'p1-pick') return state.p1.picks.length;
    if (type === 'p2-pick') return state.p2.picks.length;
    return 0;
}
function getSlotArray(type) {
    if (type === 'p1-ban') return state.p1.bans;
    if (type === 'p2-ban') return state.p2.bans;
    if (type === 'pub-ban') return state.pubBans;
    if (type === 'ladder-ban') return state.ladderBans;
    if (type === 'p1-pick') return state.p1.picks;
    if (type === 'p2-pick') return state.p2.picks;
    return null;
}

function isPetInHistory(petId) {
    if (state.selectMode === 'ban') return false;
    if (state.side === 'red') {
        for (const record of state.history) {
            if (record.p1Picks && record.p1Picks.includes(petId)) return true;
        }
        return false;
    } else {
        for (const record of state.history) {
            if (record.p2Picks && record.p2Picks.includes(petId)) return true;
        }
        return false;
    }
}

function calcMagicSum(picks) {
    let sum = 0;
    picks.forEach(pid => {
        const pet = getPet(pid);
        if (pet) sum += pet.magic;
    });
    return sum;
}

function canPlace(petId, targetType) {
    if (!petId) return false;
    const currentLoc = getPetLocation(petId);
    if (state.p1.picks.includes(petId) || state.p2.picks.includes(petId)) {
        return false;
    }
    if (currentLoc && currentLoc.type !== 'pool' && currentLoc.type !== targetType) {
        return false;
    }
    const limit = getSlotLimit(targetType);
    const count = getSlotCount(targetType);
    if (count >= limit) return false;
    if (isPetInHistory(petId)) return false;
    return true;
}

function placePet(petId, targetType, index) {
    const oldLoc = getPetLocation(petId);
    if (oldLoc && oldLoc.type !== 'pool') {
        const arr = getSlotArray(oldLoc.type);
        if (arr) { const idx = arr.indexOf(petId); if (idx > -1) arr.splice(idx, 1); }
    }
    const arr = getSlotArray(targetType);
    if (!arr) return false;
    if (index === undefined || index >= arr.length) arr.push(petId);
    else arr.splice(index, 0, petId);
    state.location[petId] = { type: targetType, index: arr.indexOf(petId) };
    return true;
}

function isPetUsable(petId) {
    if (state.p1.picks.includes(petId) || state.p2.picks.includes(petId)) {
        return false;
    }
    if (state.p1.bans.includes(petId) || state.p2.bans.includes(petId) || state.pubBans.includes(petId) || state.ladderBans.includes(petId)) {
        return false;
    }
    return isPetInPool(petId) && !isPetInHistory(petId);
}

let dragData = null;
function initDragDrop() {
    document.addEventListener('dragstart', (e) => {
        const petEl = e.target.closest('.pool-pet');
        if (!petEl || petEl.classList.contains('used') || petEl.classList.contains('history-used') || petEl.classList.contains('deletable')) {
            e.preventDefault(); return;
        }
        const petId = petEl.dataset.petId;
        if (!isPetUsable(petId)) { e.preventDefault(); return; }
        dragData = { petId };
        e.dataTransfer.setData('text/plain', petId);
        e.dataTransfer.effectAllowed = 'move';
        const ghost = petEl.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.style.position = 'fixed';
        ghost.style.pointerEvents = 'none';
        ghost.style.top = '-1000px';
        document.body.appendChild(ghost);
        e.dataTransfer.setDragImage(ghost, 22, 26);
        setTimeout(() => document.body.removeChild(ghost), 0);
        petEl.classList.add('dragging');
    });
    document.addEventListener('dragend', () => {
        document.querySelectorAll('.pool-pet.dragging').forEach(el => el.classList.remove('dragging'));
        document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        dragData = null;
    });
    const dropTargets = document.querySelectorAll('.ban-slot, .pick-slot, .ban-group, .pick-group');
    dropTargets.forEach(target => {
        target.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (target.classList.contains('ban-slot') || target.classList.contains('pick-slot')) {
                target.classList.add('drop-target');
            } else {
                target.classList.add('drag-over');
            }
        });
        target.addEventListener('dragleave', (e) => {
            target.classList.remove('drop-target');
            target.classList.remove('drag-over');
        });
        target.addEventListener('drop', (e) => {
            e.preventDefault();
            target.classList.remove('drop-target');
            target.classList.remove('drag-over');
            const petId = e.dataTransfer.getData('text/plain');
            if (!petId || !dragData) return;
            let targetType = null;
            let index = -1;
            if (target.classList.contains('ban-slot') || target.classList.contains('pick-slot')) {
                const parentSlots = target.parentElement;
                const slots = parentSlots.querySelectorAll('.ban-slot, .pick-slot');
                const idx = Array.from(slots).indexOf(target);
                if (idx === -1) return;
                const group = target.closest('.ban-group') || target.closest('.pick-group');
                if (!group) return;
                const groupType = group.dataset.group;
                if (groupType === 'p1-ban') targetType = 'p1-ban';
                else if (groupType === 'p2-ban') targetType = 'p2-ban';
                else if (groupType === 'pub-ban') targetType = 'pub-ban';
                else if (groupType === 'ladder-ban') targetType = 'ladder-ban';
                else if (groupType === 'p1-pick') targetType = 'p1-pick';
                else if (groupType === 'p2-pick') targetType = 'p2-pick';
                else return;
                const arr = getSlotArray(targetType);
                if (arr && idx < arr.length && arr[idx] !== undefined) {
                    elStatusMsg.textContent = '⚠️ 槽位已被占用';
                    return;
                }
                index = idx;
            } else {
                const group = target.closest('.ban-group') || target.closest('.pick-group');
                if (!group) return;
                const groupType = group.dataset.group;
                if (groupType === 'p1-ban') targetType = 'p1-ban';
                else if (groupType === 'p2-ban') targetType = 'p2-ban';
                else if (groupType === 'pub-ban') targetType = 'pub-ban';
                else if (groupType === 'ladder-ban') targetType = 'ladder-ban';
                else if (groupType === 'p1-pick') targetType = 'p1-pick';
                else if (groupType === 'p2-pick') targetType = 'p2-pick';
                else return;
                const arr = getSlotArray(targetType);
                if (!arr) return;
                const limit = getSlotLimit(targetType);
                for (let i = 0; i < limit; i++) {
                    if (i >= arr.length || arr[i] === undefined) { index = i; break; }
                }
                if (index === -1) { elStatusMsg.textContent = '⚠️ 该组已满'; return; }
            }

            if (!canPlace(petId, targetType)) {
                elStatusMsg.textContent = '⚠️ 无法放置（可能已被pick或历史禁用）';
                return;
            }

            const oldLoc = getPetLocation(petId);
            state.undoHistory.push({
                petId, from: oldLoc ? { ...oldLoc } : null,
                to: { type: targetType, index }
            });

            if (placePet(petId, targetType, index)) {
                elStatusMsg.textContent = `✅ 放置 ${getPet(petId).name}`;
                elBtnUndo.disabled = false;
                renderAll();
            } else {
                elStatusMsg.textContent = '❌ 放置失败';
            }
        });
    });
}

function undo() {
    if (state.undoHistory.length === 0) { elStatusMsg.textContent = '⚠️ 无可撤回'; return; }
    const last = state.undoHistory.pop();
    const petId = last.petId;
    const currentLoc = getPetLocation(petId);
    if (currentLoc && currentLoc.type !== 'pool') {
        const arr = getSlotArray(currentLoc.type);
        if (arr) { const idx = arr.indexOf(petId); if (idx > -1) arr.splice(idx, 1); }
    }
    if (last.from) {
        const from = last.from;
        if (from.type === 'pool') {
            state.location[petId] = { type: 'pool' };
        } else {
            const arr = getSlotArray(from.type);
            if (arr) {
                if (from.index !== undefined && from.index <= arr.length) arr.splice(from.index, 0, petId);
                else arr.push(petId);
                state.location[petId] = { type: from.type, index: arr.indexOf(petId) };
            } else { state.location[petId] = null; }
        }
    } else { state.location[petId] = null; }
    elStatusMsg.textContent = `↩ 撤回 ${getPet(petId).name}`;
    if (state.undoHistory.length === 0) elBtnUndo.disabled = true;
    renderAll();
}

function resetAll() {
    const isLadder = state.bpMode === 'ladder';
    let savedLadderBans = [];
    if (isLadder && state.ladderLocked) {
        savedLadderBans = [...state.ladderBans];
    }
    initLocations();
    if (isLadder && state.ladderLocked && savedLadderBans.length > 0) {
        state.ladderBans = savedLadderBans;
        savedLadderBans.forEach((pid, idx) => {
            state.location[pid] = { type: 'ladder-ban', index: idx };
        });
    }
    elBtnUndo.disabled = true;
    elStatusMsg.textContent = '🔄 已重置当前BP' + (isLadder && state.ladderLocked ? '（禁赛已保留）' : '（禁赛已清空）');
    renderAll();
}

function saveCurrentLineup() {
    let p1Picks = [...state.p1.picks];
    let p2Picks = [...state.p2.picks];

    if (state.bpMode === 'ladder') {
        if (p1Picks.length < MAX_PICK) {
            elStatusMsg.textContent = '⚠️ 天梯赛需要选满6只宠物';
            showToast('天梯赛需要选满6只宠物', 'warning');
            return;
        }
        const sum1 = calcMagicSum(p1Picks);
        if (sum1 > 16) {
            elStatusMsg.textContent = `⚠️ 魔力总和 ${sum1} > 16`;
            showToast(`魔力总和 ${sum1} > 16`, 'warning');
            return;
        }
        const unique = new Set(p1Picks);
        if (unique.size !== p1Picks.length) {
            elStatusMsg.textContent = '⚠️ 阵容中有重复宠物';
            showToast('阵容中有重复宠物', 'warning');
            return;
        }
        if (state.selectMode === 'select') {
            for (const pid of p1Picks) {
                let inP1History = false;
                for (const record of state.history) {
                    if (record.p1Picks && record.p1Picks.includes(pid)) { inP1History = true; break; }
                }
                if (inP1History) {
                    const pet = getPet(pid);
                    elStatusMsg.textContent = `⚠️ ${pet.name} 已在你的历史中`;
                    showToast(`${pet.name} 已在你的历史中`, 'warning');
                    return;
                }
            }
        }
        p2Picks = [];
    } else {
        if (p1Picks.length < MAX_PICK || p2Picks.length < MAX_PICK) {
            elStatusMsg.textContent = '⚠️ 双方都需选满6只宠物';
            showToast('双方都需选满6只宠物', 'warning');
            return;
        }
        const allPicks = [...p1Picks, ...p2Picks];
        const unique = new Set(allPicks);
        if (unique.size !== allPicks.length) {
            elStatusMsg.textContent = '⚠️ 阵容中有重复宠物';
            showToast('阵容中有重复宠物', 'warning');
            return;
        }
        if (state.bpMode === 'magic') {
            const sum1 = calcMagicSum(p1Picks);
            const sum2 = calcMagicSum(p2Picks);
            if (sum1 > 16) {
                elStatusMsg.textContent = `⚠️ P1 魔力总和 ${sum1} > 16`;
                showToast(`P1 魔力总和 ${sum1} > 16`, 'warning');
                return;
            }
            if (sum2 > 16) {
                elStatusMsg.textContent = `⚠️ P2 魔力总和 ${sum2} > 16`;
                showToast(`P2 魔力总和 ${sum2} > 16`, 'warning');
                return;
            }
        }
        if (state.selectMode === 'select') {
            for (const pid of p1Picks) {
                let inP1History = false;
                for (const record of state.history) {
                    if (record.p1Picks && record.p1Picks.includes(pid)) { inP1History = true; break; }
                }
                if (inP1History) {
                    const pet = getPet(pid);
                    elStatusMsg.textContent = `⚠️ ${pet.name} 已在红方历史中`;
                    showToast(`${pet.name} 已在红方历史中`, 'warning');
                    return;
                }
            }
            for (const pid of p2Picks) {
                let inP2History = false;
                for (const record of state.history) {
                    if (record.p2Picks && record.p2Picks.includes(pid)) { inP2History = true; break; }
                }
                if (inP2History) {
                    const pet = getPet(pid);
                    elStatusMsg.textContent = `⚠️ ${pet.name} 已在蓝方历史中`;
                    showToast(`${pet.name} 已在蓝方历史中`, 'warning');
                    return;
                }
            }
        }
    }

    const record = {
        id: Date.now(),
        timestamp: new Date().toLocaleString(),
        p1Picks, p2Picks,
        mode: state.bpMode,
        selectMode: state.selectMode,
        side: state.side,
    };
    state.history.push(record);
    if (state.history.length > 200) state.history = state.history.slice(-200);
    saveHistory(state.history);
    elStatusMsg.textContent = `💾 已保存第 ${state.history.length} 局`;
    showToast(`已保存 (${state.history.length}局)`, 'success');
    initLocations();
    state.undoHistory = [];
    elBtnUndo.disabled = true;
    renderAll();
}

function clearHistory() {
    if (state.history.length === 0) { elStatusMsg.textContent = '⚠️ 无历史'; return; }
    if (confirm('确定清空所有历史？')) {
        state.history = [];

function swapHistorySides() {

    state.history = state.history.map(record => {

            p2Picks: record.p1Picks

    saveHistory(state.history);

        player2Label.innerHTML = `🔴 <input type="text" class="player-name-input" id="p2PickName" value="${n2}" maxlength="4">`;
        const newP1 = document.getElementById('p1PickName');

        if (newP2) newP2.addEventListener('input', syncNames);

            magicSummary2.style.display = 'none';
