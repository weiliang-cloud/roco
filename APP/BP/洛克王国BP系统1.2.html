<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王国征召</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: #e8edf5;
            background-image: radial-gradient(ellipse at 20% 50%, #d6e0f0 0%, #e8edf5 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .bp-container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255,255,255,0.85);
            border-radius: 20px;
            padding: 16px 20px 20px;
            border: 1px solid rgba(200,180,140,0.3);
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
        }
        .bp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(180,160,130,0.2);
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .bp-title h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #d4a030, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .bp-title .subtitle { font-size: 11px; color: rgba(80,70,50,0.4); margin-left: 6px; }
        .history-info { font-size: 12px; color: rgba(80,70,50,0.6); background: rgba(212,175,55,0.08); padding: 2px 12px; border-radius: 16px; border:1px solid rgba(212,175,55,0.12); }
        .history-info span { font-weight:600; color:#b8860b; }
        .mode-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 12px;
            color: #555;
        }
        .mode-selector label { display: flex; align-items: center; gap: 4px; cursor:pointer; }
        .mode-selector select, .mode-selector input[type="checkbox"] {
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(180,160,140,0.3);
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 12px;
            outline: none;
        }
        .mode-selector select:focus, .mode-selector input:focus { border-color: #d4af37; }

        .main-area {
            display: grid;
            grid-template-columns: 130px 1fr 130px;
            gap: 12px;
            margin-bottom: 12px;
            transition: grid-template-columns 0.3s ease;
            min-height: 480px;   /* 保证隐藏历史后高度不变 */
        }
        .main-area.hide-history {
            grid-template-columns: 1fr !important;
            min-height: 480px;
        }
        .main-area.hide-history .history-panel {
            display: none !important;
        }

        .center-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }
        .ban-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
        }
        .ban-group {
            background: rgba(245,240,235,0.6);
            border-radius: 10px;
            padding: 6px 8px 8px;
            border: 1px solid rgba(180,160,140,0.12);
            transition: background 0.2s;
            min-height: 60px;
        }
        .ban-group.drag-over { background: rgba(212,175,55,0.08); border-color: rgba(212,175,55,0.3); }
        .ban-group .ban-label {
            font-size: 9px;
            color: rgba(80,70,50,0.5);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }
        .ban-group .ban-label .count { color: rgba(180,150,80,0.5); font-size:8px; }
        .ban-group .ban-label .limit-input {
            width: 32px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(160,150,140,0.2);
            font-size: 10px;
            text-align: center;
            color: #555;
            outline: none;
        }
        .ban-group .ban-label .limit-input:focus { border-color: #d4af37; }
        .ban-slots {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            min-height: 32px;
        }
        .ban-slot {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(200,190,180,0.15);
            border: 1.5px dashed rgba(160,150,140,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .ban-slot.filled { border-style: solid; border-color: rgba(212,175,55,0.35); background: rgba(212,175,55,0.06); }
        .ban-slot img { width: 24px; height: 24px; object-fit: contain; border-radius: 3px; }
        .ban-slot .ban-mark { position: absolute; top:-3px; right:-3px; font-size:10px; color:#d9534f; }
        .ban-slot .from-player { font-size:5px; position:absolute; bottom:0; right:1px; color:rgba(80,70,50,0.25); background:rgba(255,255,255,0.4); padding:0 2px; border-radius:2px; }
        .ban-group.public .ban-slots { justify-content:center; }
        .ban-group.public .ban-label { color: rgba(180,150,80,0.7); }

        .pick-row {
            display: grid;
            grid-template-columns: 1fr 5fr 1fr;
            gap: 14px;
            align-items: stretch;
            flex: 1;
            min-height: 0;
        }
        .pick-group {
            background: rgba(245,240,235,0.5);
            border-radius: 10px;
            padding: 6px 8px 8px;
            border: 1px solid rgba(180,160,140,0.1);
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
            min-height: 0;
            height: 100%;
        }
        .pick-group.drag-over { background: rgba(212,175,55,0.08); border-color: rgba(212,175,55,0.3); }
        .pick-group .pick-label {
            font-size: 9px;
            color: rgba(80,70,50,0.4);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 4px;
            flex-shrink: 0;
        }
        .pick-group .pick-label .badge {
            font-size:8px;
            background:rgba(212,175,55,0.08);
            padding:0 6px;
            border-radius:12px;
            color:rgba(180,150,80,0.5);
        }
        .pick-group.player1 .pick-label { color: rgba(50,130,200,0.6); }
        .pick-group.player2 .pick-label { color: rgba(200,80,80,0.6); }
        .pick-group .magic-summary {
            font-size: 10px;
            font-weight: 600;
            color: rgba(180,150,80,0.5);
            text-align: center;
            margin: 2px 0;
            flex-shrink: 0;
        }
        .pick-group .magic-summary .over { color: #d9534f; }

        .pick-slots {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 0;
        }
        .pick-slot {
            flex: 1;
            width: 100%;
            min-height: 0;
            border-radius: 8px;
            background: rgba(200,190,180,0.1);
            border: 1.5px dashed rgba(160,150,140,0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            box-sizing: border-box;
        }
        .pick-slot.filled {
            border-style: solid;
            border-color: rgba(212,175,55,0.25);
            background: rgba(212,175,55,0.04);
        }
        .pick-slot img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .pick-slot .pick-value {
            font-size: 12px;
            font-weight: 700;
            color: rgba(180,150,80,0.6);
        }
        .pick-slot .empty-hint { font-size:12px; color:rgba(160,150,140,0.2); margin:0 auto; }

        .pet-pool {
            background: rgba(245,240,235,0.4);
            border-radius: 10px;
            padding: 6px 8px 8px;
            border: 1px solid rgba(180,160,140,0.08);
            max-height: 410px;
            overflow-y: auto;
            min-width: 0;
            height: 100%;
        }
        .pet-pool::-webkit-scrollbar { width:3px; }
        .pet-pool::-webkit-scrollbar-thumb { background:rgba(180,150,80,0.15); border-radius:6px; }
        .pool-title {
            font-size:9px;
            color:rgba(80,70,50,0.3);
            display:flex;
            justify-content:space-between;
            margin-bottom:4px;
        }
        .pool-title .remain { color:rgba(180,150,80,0.3); }
        .pool-group { margin-bottom:4px; }
        .pool-group .group-label {
            font-size:10px;
            font-weight:700;
            color:rgba(180,150,80,0.4);
            display:flex;
            align-items:center;
            gap:4px;
        }
        .pool-group .group-label .line { flex:1; height:1px; background:rgba(180,160,140,0.08); }
        .pool-items {
            display:flex;
            flex-wrap:wrap;
            gap:4px;
            margin-top:2px;
        }
        .pool-pet {
            width:44px;
            height:52px;
            border-radius:8px;
            background:rgba(255,255,255,0.5);
            border:1px solid rgba(180,160,140,0.12);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            cursor:grab;
            transition:all 0.15s;
            padding:2px;
            gap:0;
            box-shadow:0 1px 4px rgba(0,0,0,0.02);
        }
        .pool-pet:hover:not(.used):not(.history-used) {
            transform:translateY(-2px);
            border-color:rgba(212,175,55,0.3);
            background:#fff;
            box-shadow:0 2px 8px rgba(0,0,0,0.04);
        }
        .pool-pet img { width:36px; height:36px; object-fit:contain; border-radius:4px; pointer-events:none; }
        .pool-pet .pet-name {
            font-size:7px;
            color:rgba(50,45,40,0.5);
            text-align:center;
            white-space:nowrap;
            max-width:40px;
            overflow:hidden;
            text-overflow:ellipsis;
            pointer-events:none;
            margin-top:1px;
        }
        .pool-pet.used {
            opacity:0.2;
            cursor:not-allowed;
            filter:grayscale(0.9);
            transform:scale(0.9);
            border-color:rgba(200,80,80,0.1);
        }
        .pool-pet.history-used {
            opacity:0.3;
            cursor:not-allowed;
            filter:grayscale(0.7);
            transform:scale(0.92);
            border-color:rgba(180,150,80,0.2);
            border-style:dashed;
        }
        .pool-pet.used::after, .pool-pet.history-used::after {
            content:'✕';
            position:absolute;
            font-size:12px;
            color:rgba(200,80,80,0.25);
        }
        .pool-pet.dragging { opacity:0.4; transform:scale(0.95); }

        .history-panel {
            background: rgba(245,240,235,0.3);
            border-radius: 10px;
            padding: 6px 4px;
            border: 1px solid rgba(180,160,140,0.08);
            max-height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .history-panel::-webkit-scrollbar { width:3px; }
        .history-panel::-webkit-scrollbar-thumb { background:rgba(180,150,80,0.15); border-radius:6px; }
        .history-panel .panel-title {
            font-size:8px;
            color:rgba(80,70,50,0.3);
            text-align:center;
            letter-spacing:0.5px;
            border-bottom:1px solid rgba(180,160,140,0.06);
            padding-bottom:3px;
            flex-shrink:0;
        }
        .history-record {
            background:rgba(255,255,255,0.3);
            border-radius:6px;
            padding:4px 4px 4px;
            border:1px solid rgba(180,160,140,0.04);
            flex-shrink:0;
        }
        .history-record .record-header {
            font-size:7px;
            color:rgba(80,70,50,0.25);
            display:flex;
            justify-content:space-between;
            padding:0 2px 2px;
            border-bottom:1px dashed rgba(180,160,140,0.06);
        }
        .history-record .record-num { font-weight:600; color:rgba(180,150,80,0.4); }
        .history-pets {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: space-between;
            margin-top: 2px;
        }
        .history-pet {
            width: calc(33.33% - 4px);
            height: 32px;
            border-radius: 4px;
            background: rgba(255,255,255,0.4);
            border: 1px solid rgba(180,160,140,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex: 0 0 auto;
        }
        .history-pet img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }
        .history-empty { text-align:center; color:rgba(80,70,50,0.15); font-size:10px; padding:20px 0; }

        .bp-controls {
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            padding-top:12px;
            border-top:1px solid rgba(180,160,140,0.1);
            flex-wrap:wrap;
            zoom:1.5;
        }
        .bp-controls button {
            padding:2px 10px;
            border:none;
            border-radius:14px;
            font-size:9px;
            font-weight:600;
            cursor:pointer;
            transition:0.2s;
            background:rgba(200,190,180,0.15);
            color:rgba(80,70,50,0.5);
            border:1px solid rgba(180,160,140,0.08);
        }
        .bp-controls button:hover:not(:disabled) {
            background:rgba(212,175,55,0.08);
            color:#b8860b;
            border-color:rgba(212,175,55,0.15);
        }
        .bp-controls button:disabled { opacity:0.2; cursor:not-allowed; }
        .bp-controls button.primary {
            background:linear-gradient(135deg, rgba(212,175,55,0.12), rgba(184,134,11,0.06));
            color:#b8860b;
        }
        .bp-controls button.primary:hover:not(:disabled) {
            background:linear-gradient(135deg, rgba(212,175,55,0.2), rgba(184,134,11,0.1));
        }
        .bp-controls button.danger { color:#d9534f; }
        .bp-controls button.danger:hover:not(:disabled) { background:rgba(217,83,79,0.06); }
        .bp-controls .status-msg {
            font-size:8px;
            color:rgba(80,70,50,0.3);
            min-width:80px;
            text-align:center;
        }

        .player-name-input {
            background:transparent;
            border:none;
            border-bottom:1px solid rgba(160,150,140,0.2);
            font-size:10px;
            font-weight:600;
            padding:0 2px;
            width:50px;
            outline:none;
            color:inherit;
        }
        .pick-group.player1 .player-name-input { color:rgba(50,130,200,0.8); }
        .pick-group.player2 .player-name-input { color:rgba(200,80,80,0.8); }

        @media (max-width: 820px) {
            .main-area { grid-template-columns: 1fr; gap:8px; min-height:auto; }
            .history-panel { max-height:200px; }
            .ban-row { grid-template-columns:1fr 1fr 1fr; }
            .pick-row { grid-template-columns:1fr; gap:8px; }
            .pick-slot { max-width:100%; }
            .pet-pool { max-height:200px; }
        }
        @media (max-width: 600px) {
            .mode-selector { flex-direction:column; align-items:flex-start; }
            .bp-header { flex-direction:column; align-items:stretch; }
        }
        .drop-target { border-color:#d4af37 !important; background:rgba(212,175,55,0.08) !important; box-shadow:0 0 12px rgba(212,175,55,0.06); }
        .toast {
            position:fixed;
            bottom:20px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.7);
            color:#fff;
            padding:6px 20px;
            border-radius:20px;
            font-size:13px;
            z-index:999;
            animation:fadeInOut 2.4s ease forwards;
            pointer-events:none;
        }
        @keyframes fadeInOut {
            0% { opacity:0; transform:translateX(-50%) translateY(10px); }
            15% { opacity:1; transform:translateX(-50%) translateY(0); }
            85% { opacity:1; transform:translateX(-50%) translateY(0); }
            100% { opacity:0; transform:translateX(-50%) translateY(-10px); }
        }
    </style>
</head>
<body>
<div class="bp-container" id="app">
    <div class="bp-header">
        <div class="bp-title">
            <h1>⚔️ 洛克王国征召</h1>
        </div>
        <div class="history-info">📋 已保存 <span id="historyCount">0</span> 局</div>
        <div class="mode-selector">
            <label>模式：
                <select id="bpModeSelect">
                    <option value="normal">常规 BP</option>
                    <option value="magic">魔力赛 BP</option>
                </select>
            </label>
            <label>全局：
                <input type="checkbox" id="globalModeCheck" checked>
            </label>
        </div>
    </div>

    <div class="main-area" id="mainArea">
        <div class="history-panel" id="historyLeft">
            <div class="panel-title">📜 玩家1</div>
            <div id="historyLeftContent"><div class="history-empty">暂无</div></div>
        </div>

        <div class="center-col">
            <div class="ban-row">
                <div class="ban-group" data-group="p1-ban">
                    <div class="ban-label">
                        <span>🔵 <span id="banName1">P1</span> Ban位</span>
                        <span class="count">
                            <span id="banCount1">0</span>/<input type="number" class="limit-input" id="banLimit1" value="5" min="0" max="6">
                        </span>
                    </div>
                    <div class="ban-slots" id="banSlots1"></div>
                </div>
                <div class="ban-group public" data-group="pub-ban">
                    <div class="ban-label">
                        <span>⭐ 公ban</span>
                        <span class="count">
                            <span id="banCountPub">0</span>/<input type="number" class="limit-input" id="banLimitPub" value="2" min="0" max="4">
                        </span>
                    </div>
                    <div class="ban-slots" id="banSlotsPub"></div>
                </div>
                <div class="ban-group" data-group="p2-ban">
                    <div class="ban-label">
                        <span>🔴 <span id="banName2">P2</span> Ban位</span>
                        <span class="count">
                            <span id="banCount2">0</span>/<input type="number" class="limit-input" id="banLimit2" value="5" min="0" max="6">
                        </span>
                    </div>
                    <div class="ban-slots" id="banSlots2"></div>
                </div>
            </div>

            <div class="pick-row">
                <div class="pick-group player1" data-group="p1-pick">
                    <div class="pick-label">
                        <span>🔵 <input type="text" class="player-name-input" id="p1PickName" value="P1" maxlength="4"></span>
                        <span class="badge" id="pickCount1">0/6</span>
                    </div>
                    <div class="magic-summary" id="magicSummary1"></div>
                    <div class="pick-slots" id="pickSlots1">
                        <div class="pick-slot" data-index="0"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="1"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="2"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="3"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="4"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="5"><span class="empty-hint">—</span></div>
                    </div>
                </div>

                <div class="pet-pool" id="petPool">
                    <div class="pool-title"><span>🐾 宠物池</span><span class="remain" id="remainCount">剩余: 0</span></div>
                    <div id="poolGroups"></div>
                </div>

                <div class="pick-group player2" data-group="p2-pick">
                    <div class="pick-label">
                        <span>🔴 <input type="text" class="player-name-input" id="p2PickName" value="P2" maxlength="4"></span>
                        <span class="badge" id="pickCount2">0/6</span>
                    </div>
                    <div class="magic-summary" id="magicSummary2"></div>
                    <div class="pick-slots" id="pickSlots2">
                        <div class="pick-slot" data-index="0"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="1"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="2"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="3"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="4"><span class="empty-hint">—</span></div>
                        <div class="pick-slot" data-index="5"><span class="empty-hint">—</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="history-panel" id="historyRight">
            <div class="panel-title">📜 玩家2</div>
            <div id="historyRightContent"><div class="history-empty">暂无</div></div>
        </div>
    </div>

    <div class="bp-controls">
        <button class="danger" id="btnReset">⟳ 重置</button>
        <button id="btnUndo" disabled>↩ 撤回</button>
        <button class="primary" id="btnSave">💾 保存</button>
        <button class="danger" id="btnClearHistory" style="font-size:9px;padding:2px 8px;">🗑 清历史</button>
        <button class="primary" id="btnToggleHistory" style="font-size:9px;padding:2px 8px;">👁 隐藏历史</button>
        <button class="primary" id="btnSwapHistory" style="font-size:9px;padding:2px 8px;">🔄 交换双方历史</button>
        <span class="status-msg" id="statusMsg">拖拽宠物到目标槽位</span>
    </div>
</div>

<script>
// ================================================================
// 宠物数据（完整）
// ================================================================
const PETS = [
  { "id": "m5-1", "name": "巴哈姆特", "magic": 5, "imageSourceUrl": "https://res.17roco.qq.com/res/combat/icons/3172-.png" },

// ================================================================
// 状态管理
// ================================================================
const MAX_PICK = 6;
const DEFAULT_BAN_LIMITS = { p1:5, p2:5, pub:2 };

function loadHistory() {
    try {
        const data = localStorage.getItem('bp_history');
        if (data) {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed)) return parsed;
        }
    } catch(e) {}
    return [];
}

function saveHistory(history) {
    try {
        localStorage.setItem('bp_history', JSON.stringify(history));
    } catch(e) {}
}

const state = {
    allPets: PETS.map(p => ({ ...p })),
    location: {},
    p1: { bans: [], picks: [] },
    p2: { bans: [], picks: [] },
    pubBans: [],
    history: loadHistory(),
    undoHistory: [],
    banLimits: { ...DEFAULT_BAN_LIMITS },
    bpMode: 'normal',
    globalMode: true,
};

function initLocations() {
    state.location = {};
    state.allPets.forEach(p => { state.location[p.id] = { type: 'pool' }; });
    state.p1.bans = [];
    state.p1.picks = [];
    state.p2.bans = [];
    state.p2.picks = [];
    state.pubBans = [];
    state.undoHistory = [];
}
initLocations();

// ================================================================
// 辅助函数
// ================================================================
function getPet(id) { return state.allPets.find(p => p.id === id); }
function isPetInPool(petId) { return state.location[petId] && state.location[petId].type === 'pool'; }
function getPetLocation(petId) { return state.location[petId] || null; }
function getSlotLimit(type) {
    if (type === 'p1-ban') return state.banLimits.p1;
    if (type === 'p2-ban') return state.banLimits.p2;
    if (type === 'pub-ban') return state.banLimits.pub;
    if (type === 'p1-pick' || type === 'p2-pick') return MAX_PICK;
    return 0;
}
function getSlotCount(type) {
    if (type === 'p1-ban') return state.p1.bans.length;
    if (type === 'p2-ban') return state.p2.bans.length;
    if (type === 'pub-ban') return state.pubBans.length;
    if (type === 'p1-pick') return state.p1.picks.length;
    if (type === 'p2-pick') return state.p2.picks.length;
    return 0;
}
function getSlotArray(type) {
    if (type === 'p1-ban') return state.p1.bans;
    if (type === 'p2-ban') return state.p2.bans;
    if (type === 'pub-ban') return state.pubBans;
    if (type === 'p1-pick') return state.p1.picks;
    if (type === 'p2-pick') return state.p2.picks;
    return null;
}

function isPetInHistory(petId) {
    if (!state.globalMode) return false;
    for (const record of state.history) {
        if (record.p1Picks && record.p1Picks.includes(petId)) return true;
        if (record.p2Picks && record.p2Picks.includes(petId)) return true;
    }
    return false;
}

function calcMagicSum(picks) {
    let sum = 0;
    picks.forEach(pid => {
        const pet = getPet(pid);
        if (pet) sum += pet.magic;
    });
    return sum;
}

function canPlace(petId, targetType) {
    if (!petId) return false;
    if (!isPetInPool(petId) && getPetLocation(petId)?.type !== targetType) return false;
    const limit = getSlotLimit(targetType);
    const count = getSlotCount(targetType);
    if (count >= limit) return false;
    if (isPetInHistory(petId)) return false;
    return true;
}

function placePet(petId, targetType, index) {
    const oldLoc = getPetLocation(petId);
    if (oldLoc && oldLoc.type !== 'pool') {
        const arr = getSlotArray(oldLoc.type);
        if (arr) { const idx = arr.indexOf(petId); if (idx > -1) arr.splice(idx, 1); }
    }
    const arr = getSlotArray(targetType);
    if (!arr) return false;
    if (index === undefined || index >= arr.length) arr.push(petId);
    else arr.splice(index, 0, petId);
    state.location[petId] = { type: targetType, index: arr.indexOf(petId) };
    return true;
}

function isPetUsable(petId) {
    return isPetInPool(petId) && !isPetInHistory(petId);
}

// ================================================================
// 拖拽逻辑
// ================================================================
let dragData = null;
function initDragDrop() {
    document.addEventListener('dragstart', (e) => {
        const petEl = e.target.closest('.pool-pet');
        if (!petEl || petEl.classList.contains('used') || petEl.classList.contains('history-used')) {
            e.preventDefault(); return;
        }
        const petId = petEl.dataset.petId;
        if (!isPetUsable(petId)) { e.preventDefault(); return; }
        dragData = { petId };
        e.dataTransfer.setData('text/plain', petId);
        e.dataTransfer.effectAllowed = 'move';
        const ghost = petEl.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.style.position = 'fixed';
        ghost.style.pointerEvents = 'none';
        ghost.style.top = '-1000px';
        document.body.appendChild(ghost);
        e.dataTransfer.setDragImage(ghost, 22, 26);
        setTimeout(() => document.body.removeChild(ghost), 0);
        petEl.classList.add('dragging');
    });
    document.addEventListener('dragend', () => {
        document.querySelectorAll('.pool-pet.dragging').forEach(el => el.classList.remove('dragging'));
        document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        dragData = null;
    });
    const dropTargets = document.querySelectorAll('.ban-slot, .pick-slot, .ban-group, .pick-group');
    dropTargets.forEach(target => {
        target.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (target.classList.contains('ban-slot') || target.classList.contains('pick-slot')) {
                target.classList.add('drop-target');
            } else {
                target.classList.add('drag-over');
            }
        });
        target.addEventListener('dragleave', (e) => {
            target.classList.remove('drop-target');
            target.classList.remove('drag-over');
        });
        target.addEventListener('drop', (e) => {
            e.preventDefault();
            target.classList.remove('drop-target');
            target.classList.remove('drag-over');
            const petId = e.dataTransfer.getData('text/plain');
            if (!petId || !dragData) return;
            let targetType = null;
            let index = -1;
            if (target.classList.contains('ban-slot') || target.classList.contains('pick-slot')) {
                const parentSlots = target.parentElement;
                const slots = parentSlots.querySelectorAll('.ban-slot, .pick-slot');
                const idx = Array.from(slots).indexOf(target);
                if (idx === -1) return;
                const group = target.closest('.ban-group') || target.closest('.pick-group');
                if (!group) return;
                const groupType = group.dataset.group;
                if (groupType === 'p1-ban') targetType = 'p1-ban';
                else if (groupType === 'p2-ban') targetType = 'p2-ban';
                else if (groupType === 'pub-ban') targetType = 'pub-ban';
                else if (groupType === 'p1-pick') targetType = 'p1-pick';
                else if (groupType === 'p2-pick') targetType = 'p2-pick';
                else return;
                const arr = getSlotArray(targetType);
                if (arr && idx < arr.length && arr[idx] !== undefined) {
                    elStatusMsg.textContent = '⚠️ 槽位已被占用';
                    return;
                }
                index = idx;
            } else {
                const group = target.closest('.ban-group') || target.closest('.pick-group');
                if (!group) return;
                const groupType = group.dataset.group;
                if (groupType === 'p1-ban') targetType = 'p1-ban';
                else if (groupType === 'p2-ban') targetType = 'p2-ban';
                else if (groupType === 'pub-ban') targetType = 'pub-ban';
                else if (groupType === 'p1-pick') targetType = 'p1-pick';
                else if (groupType === 'p2-pick') targetType = 'p2-pick';
                else return;
                const arr = getSlotArray(targetType);
                if (!arr) return;
                const limit = getSlotLimit(targetType);
                for (let i = 0; i < limit; i++) {
                    if (i >= arr.length || arr[i] === undefined) { index = i; break; }
                }
                if (index === -1) { elStatusMsg.textContent = '⚠️ 该组已满'; return; }
            }

            if (!canPlace(petId, targetType)) {
                elStatusMsg.textContent = '⚠️ 无法放置（可能已在其他位置或历史禁用）';
                return;
            }

            const oldLoc = getPetLocation(petId);
            state.undoHistory.push({
                petId, from: oldLoc ? { ...oldLoc } : null,
                to: { type: targetType, index }
            });

            if (placePet(petId, targetType, index)) {
                elStatusMsg.textContent = `✅ 放置 ${getPet(petId).name}`;
                elBtnUndo.disabled = false;
                renderAll();
            } else {
                elStatusMsg.textContent = '❌ 放置失败';
            }
        });
    });
}

// ================================================================
// 撤回、重置、保存、清历史、交换历史
// ================================================================
function undo() {
    if (state.undoHistory.length === 0) { elStatusMsg.textContent = '⚠️ 无可撤回'; return; }
    const last = state.undoHistory.pop();
    const petId = last.petId;
    const currentLoc = getPetLocation(petId);
    if (currentLoc && currentLoc.type !== 'pool') {
        const arr = getSlotArray(currentLoc.type);
        if (arr) { const idx = arr.indexOf(petId); if (idx > -1) arr.splice(idx, 1); }
    }
    if (last.from) {
        const from = last.from;
        if (from.type === 'pool') {
            state.location[petId] = { type: 'pool' };
        } else {
            const arr = getSlotArray(from.type);
            if (arr) {
                if (from.index !== undefined && from.index <= arr.length) arr.splice(from.index, 0, petId);
                else arr.push(petId);
                state.location[petId] = { type: from.type, index: arr.indexOf(petId) };
            } else { state.location[petId] = null; }
        }
    } else { state.location[petId] = null; }
    elStatusMsg.textContent = `↩ 撤回 ${getPet(petId).name}`;
    if (state.undoHistory.length === 0) elBtnUndo.disabled = true;
    renderAll();
}

function resetAll() {
    initLocations();
    elBtnUndo.disabled = true;
    elStatusMsg.textContent = '🔄 已重置当前BP';
    renderAll();
}

function saveCurrentLineup() {
    const p1Picks = [...state.p1.picks];
    const p2Picks = [...state.p2.picks];
    if (p1Picks.length < MAX_PICK || p2Picks.length < MAX_PICK) {
        elStatusMsg.textContent = '⚠️ 双方都需选满6只宠物';
        showToast('双方都需选满6只宠物', 'warning');
        return;
    }
    const allPicks = [...p1Picks, ...p2Picks];
    const unique = new Set(allPicks);
    if (unique.size !== allPicks.length) {
        elStatusMsg.textContent = '⚠️ 阵容中有重复宠物';
        showToast('阵容中有重复宠物', 'warning');
        return;
    }

    if (state.bpMode === 'magic') {
        const sum1 = calcMagicSum(p1Picks);
        const sum2 = calcMagicSum(p2Picks);
        if (sum1 > 16) {
            elStatusMsg.textContent = `⚠️ P1 魔力总和 ${sum1} > 16`;
            showToast(`P1 魔力总和 ${sum1} > 16`, 'warning');
            return;
        }
        if (sum2 > 16) {
            elStatusMsg.textContent = `⚠️ P2 魔力总和 ${sum2} > 16`;
            showToast(`P2 魔力总和 ${sum2} > 16`, 'warning');
            return;
        }
    }

    if (state.globalMode) {
        for (const pid of allPicks) {
            if (isPetInHistory(pid)) {
                const pet = getPet(pid);
                elStatusMsg.textContent = `⚠️ ${pet.name} 已在历史中`;
                showToast(`${pet.name} 已在历史中`, 'warning');
                return;
            }
        }
    }

    const record = {
        id: Date.now(),
        timestamp: new Date().toLocaleString(),
        p1Picks, p2Picks,
        mode: state.bpMode,
        global: state.globalMode,
    };
    state.history.push(record);
    if (state.history.length > 200) state.history = state.history.slice(-200);
    saveHistory(state.history);
    elStatusMsg.textContent = `💾 已保存第 ${state.history.length} 局`;
    showToast(`已保存 (${state.history.length}局)`, 'success');
    initLocations();
    state.undoHistory = [];
    elBtnUndo.disabled = true;
    renderAll();
}

function clearHistory() {
    if (state.history.length === 0) { elStatusMsg.textContent = '⚠️ 无历史'; return; }
    if (confirm('确定清空所有历史？')) {
        state.history = [];
        saveHistory(state.history);
        elStatusMsg.textContent = '🗑 已清空';
        renderAll();
    }
}

function swapHistorySides() {
    if (state.history.length === 0) {
        showToast('没有历史记录可交换', 'warning');
        return;
    }
    state.history = state.history.map(record => {
        return {
            ...record,
            p1Picks: record.p2Picks,
            p2Picks: record.p1Picks
        };
    });
    saveHistory(state.history);
    renderAll();
    showToast('✅ 已交换双方历史阵容', 'success');
}

function toggleHistory() {
    mainArea.classList.toggle('hide-history');
    btnToggleHistory.textContent = mainArea.classList.contains('hide-history') ? '👁 显示历史' : '👁 隐藏历史';
}

function showToast(msg, type) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    if (type === 'warning') toast.style.background = 'rgba(200,80,50,0.85)';
    else if (type === 'success') toast.style.background = 'rgba(50,150,80,0.85)';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2400);
}

// ================================================================
// 渲染
// ================================================================
function renderAll() {
    renderBanSlots();
    renderPickSlots();
    renderPool();
    renderCounts();
    renderHistory();
    updateHistoryCount();
    updateMagicSummary();
}

function renderBanSlots() {
    renderBanGroup(elBanSlots1, state.p1.bans, 'p1-ban');
    renderBanGroup(elBanSlots2, state.p2.bans, 'p2-ban');
    renderBanGroup(elBanSlotsPub, state.pubBans, 'pub-ban');
}

function renderBanGroup(container, banIds, groupType) {
    const limit = getSlotLimit(groupType);
    container.innerHTML = '';
    for (let i = 0; i < limit; i++) {
        const slot = document.createElement('div');
        slot.className = 'ban-slot';
        slot.dataset.index = i;
        container.appendChild(slot);
    }
    const slots = container.querySelectorAll('.ban-slot');
    slots.forEach((slot, idx) => {
        const petId = banIds[idx] || null;
        if (petId) {
            const pet = getPet(petId);
            if (pet) {
                slot.className = 'ban-slot filled';
                let html = `<img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">`;
                if (groupType !== 'pub-ban') html += `<span class="ban-mark">✕</span>`;
                else {
                    const fromP1 = state.p1.bans.includes(petId);
                    const fromP2 = state.p2.bans.includes(petId);
                    if (fromP1 || fromP2) html += `<span class="from-player">${fromP1?'P1':'P2'}</span>`;
                }
                slot.innerHTML = html;
            }
        } else {
            slot.className = 'ban-slot';
            slot.innerHTML = '';
        }
    });
}

function renderPickSlots() {
    renderPickGroup(elPickSlots1, state.p1.picks, 'p1-pick');
    renderPickGroup(elPickSlots2, state.p2.picks, 'p2-pick');
}

function renderPickGroup(container, pickIds, groupType) {
    const slots = container.querySelectorAll('.pick-slot');
    while (slots.length < MAX_PICK) {
        const newSlot = document.createElement('div');
        newSlot.className = 'pick-slot';
        newSlot.dataset.index = slots.length;
        container.appendChild(newSlot);
    }
    const allSlots = container.querySelectorAll('.pick-slot');
    allSlots.forEach((slot, idx) => {
        const petId = pickIds[idx] || null;
        if (petId) {
            const pet = getPet(petId);
            if (pet) {
                slot.className = 'pick-slot filled';
                const isLeft = groupType === 'p1-pick';
                const magicHtml = `<span class="pick-value">${pet.magic}</span>`;
                slot.innerHTML = `
                    ${isLeft ? magicHtml : ''}
                    <img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">
                    ${!isLeft ? magicHtml : ''}
                `;
            }
        } else {
            slot.className = 'pick-slot';
            slot.innerHTML = `<span class="empty-hint">—</span>`;
        }
    });
}

function renderPool() {
    const groups = {};
    state.allPets.forEach(pet => {
        if (!groups[pet.magic]) groups[pet.magic] = [];
        groups[pet.magic].push(pet);
    });
    const sorted = Object.keys(groups).sort((a,b)=>b-a);
    let html = '';
    sorted.forEach(val => {
        const pets = groups[val];
        html += `<div class="pool-group"><div class="group-label"><span>${val}★</span><span class="line"></span></div><div class="pool-items">`;
        pets.forEach(pet => {
            const inPool = isPetInPool(pet.id);
            const inHistory = isPetInHistory(pet.id);
            let cls = 'pool-pet';
            if (!inPool) cls += ' used';
            if (inHistory) cls += ' history-used';
            const draggable = inPool && !inHistory;
            html += `<div class="${cls}" data-pet-id="${pet.id}" title="${pet.name} (${pet.magic}★)" draggable="${draggable?'true':'false'}">
                <img src="${pet.imageSourceUrl}" alt="${pet.name}" loading="lazy">
                <span class="pet-name">${pet.name}</span>
            </div>`;
        });
        html += `</div></div>`;
    });
    elPoolGroups.innerHTML = html;
    const total = state.allPets.length;
    const used = state.allPets.filter(p => !isPetInPool(p.id) || isPetInHistory(p.id)).length;
    elRemainCount.textContent = `剩余: ${total - used}`;
}

function renderCounts() {
    elBanCount1.textContent = state.p1.bans.length;
    elBanCount2.textContent = state.p2.bans.length;
    elBanCountPub.textContent = state.pubBans.length;
    elPickCount1.textContent = `${state.p1.picks.length}/${MAX_PICK}`;
    elPickCount2.textContent = `${state.p2.picks.length}/${MAX_PICK}`;
}

function renderHistory() {
    let leftHtml = '', rightHtml = '';
    if (state.history.length === 0) {
        leftHtml = rightHtml = '<div class="history-empty">暂无</div>';
    } else {
        const records = [...state.history].reverse();
        records.forEach((record, idx) => {
            const num = state.history.length - idx;
            const time = record.timestamp || '';
            const recordHtml = (picks) => {
                let petsHtml = '';
                if (picks) {
                    picks.forEach(pid => {
                        const pet = getPet(pid);
                        if (pet) petsHtml += `<div class="history-pet" title="${pet.name}"><img src="${pet.imageSourceUrl}" alt=""></div>`;
                    });
                }
                return `
                    <div class="history-record">
                        <div class="record-header">
                            <span class="record-num">第${num}局</span>
                            <span>${time}</span>
                        </div>
                        <div class="history-pets">${petsHtml}</div>
                    </div>
                `;
            };
            leftHtml += recordHtml(record.p1Picks);
            rightHtml += recordHtml(record.p2Picks);
        });
    }
    elHistoryLeftContent.innerHTML = leftHtml;
    elHistoryRightContent.innerHTML = rightHtml;
}

function updateHistoryCount() {
    elHistoryCount.textContent = state.history.length;
}

function updateMagicSummary() {
    if (state.bpMode === 'magic') {
        const sum1 = calcMagicSum(state.p1.picks);
        const sum2 = calcMagicSum(state.p2.picks);
        magicSummary1.innerHTML = `魔力总和: <span class="${sum1>16?'over':''}">${sum1}</span> / 16`;
        magicSummary2.innerHTML = `魔力总和: <span class="${sum2>16?'over':''}">${sum2}</span> / 16`;
        magicSummary1.style.display = 'block';
        magicSummary2.style.display = 'block';
    } else {
        magicSummary1.style.display = 'none';
        magicSummary2.style.display = 'none';
    }
}

function syncNames() {
    const n1 = p1PickName.value.trim() || 'P1';
    const n2 = p2PickName.value.trim() || 'P2';
    banName1.textContent = n1;
    banName2.textContent = n2;
}

function syncBanLimits() {
    state.banLimits.p1 = parseInt(banLimit1.value) || 0;
    state.banLimits.p2 = parseInt(banLimit2.value) || 0;
    state.banLimits.pub = parseInt(banLimitPub.value) || 0;
    if (state.banLimits.p1 > 6) state.banLimits.p1 = 6;
    if (state.banLimits.p2 > 6) state.banLimits.p2 = 6;
    if (state.banLimits.pub > 4) state.banLimits.pub = 4;
    ['p1','p2'].forEach(p => {
        const bans = state[p].bans;
        if (bans.length > state.banLimits[p]) {
            const removed = bans.splice(state.banLimits[p]);
            removed.forEach(id => { state.location[id] = { type: 'pool' }; });
        }
    });
    if (state.pubBans.length > state.banLimits.pub) {
        const removed = state.pubBans.splice(state.banLimits.pub);
        removed.forEach(id => { state.location[id] = { type: 'pool' }; });
    }
    renderAll();
}

function syncMode() {
    state.bpMode = bpModeSelect.value;
    state.globalMode = globalModeCheck.checked;
    renderAll();
    elStatusMsg.textContent = `模式: ${state.bpMode==='magic'?'魔力赛':'常规'} BP, ${state.globalMode?'全局':'非全局'}`;
}

// ================================================================
// 初始化
// ================================================================
function init() {
    p1PickName.addEventListener('input', syncNames);
    p2PickName.addEventListener('input', syncNames);
    banLimit1.addEventListener('change', syncBanLimits);
    banLimit2.addEventListener('change', syncBanLimits);
    banLimitPub.addEventListener('change', syncBanLimits);
    bpModeSelect.addEventListener('change', syncMode);
    globalModeCheck.addEventListener('change', syncMode);

    elBtnUndo.addEventListener('click', undo);
    elBtnReset.addEventListener('click', resetAll);
    elBtnSave.addEventListener('click', saveCurrentLineup);
    elBtnClearHistory.addEventListener('click', clearHistory);
    btnToggleHistory.addEventListener('click', toggleHistory);
    btnSwapHistory.addEventListener('click', swapHistorySides);

    syncNames();
    syncBanLimits();
    syncMode();
    renderAll();
    initDragDrop();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
